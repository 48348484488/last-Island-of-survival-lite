name: Recover missing HUD sprites from exact original Unity CAB references
on:
  push:
    paths:
      - tools/recover_hud_missing_external_atlases.py
      - .github/workflows/recover_hud_missing_external_atlases.yml
  workflow_dispatch:
permissions: {contents: write}
jobs:
  recover-source:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install "UnityPy>=1.20,<2" Pillow
      - name: Resolve original AssetBundle CAB GUIDs and extract missing Image Sprite references
        run: python -u tools/recover_hud_missing_external_atlases.py
      - name: Commit only verified Sprite files with Unity CAB and PathID provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_island_recreated_game/assets/hud_original_xapk/complete_source_mapping/
          if ! git diff --staged --quiet; then
            git commit -m "Recover missing original HUD sprites by exact Unity external CAB references"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: missing-original-HUD-sprites-found-by-CAB-guid
          path: last_island_recreated_game/assets/hud_original_xapk/complete_source_mapping/
          if-no-files-found: warn
