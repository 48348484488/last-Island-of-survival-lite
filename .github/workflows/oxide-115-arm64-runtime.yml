name: Oxide 1.15 ARM64 virtual runtime probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oxide-115-arm64-runtime.yml'
jobs:
  runtime:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install virtual Android prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq adb curl jq
          sudo modprobe binder_linux devices=binder,hwbinder,vndbinder || true
          sudo modprobe ashmem_linux || true
          ls -l /dev/binder* /dev/ashmem /dev/kvm 2>&1 || true
      - name: Download unmodified fourth APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.15.11966 --repo 48348484488/oxide --pattern split_UnityDataAssetPack.apk --dir .
          python3 tools/audit_original_split_hashes.py --output original-apk-inventory.json
          python3 -c "import json; assert json.load(open('original-apk-inventory.json'))['complete']"
      - name: Run Redroid Android ARM64 container
        run: |
          mkdir -p reports
          docker info > reports/docker-info.txt 2>&1 || true
          docker pull redroid/redroid:13.0.0-latest > reports/pull.log 2>&1 || true
          docker run -d --name oxide-android --privileged -p 5555:5555 redroid/redroid:13.0.0-latest androidboot.redroid_width=720 androidboot.redroid_height=1280 androidboot.redroid_dpi=320 > reports/container-id.txt 2> reports/container-error.txt || true
          for i in $(seq 1 45); do
            adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true
            if adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | grep -q 1; then break; fi
            sleep 4
          done
          adb devices -l > reports/adb-devices.txt
          adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abi > reports/abi.txt 2>&1 || true
          adb -s 127.0.0.1:5555 shell getprop sys.boot_completed > reports/boot.txt 2>&1 || true
      - name: Install and launch original game if virtual Android booted
        run: |
          if ! grep -q 1 reports/boot.txt || ! grep -q arm64 reports/abi.txt; then
            echo "BLOCKED: ARM64 virtual Android did not boot" | tee reports/verdict.txt
            exit 0
          fi
          adb -s 127.0.0.1:5555 install-multiple -r base.apk split_config.arm64_v8a.apk split_config.xxhdpi.apk split_UnityDataAssetPack.apk > reports/install.txt 2>&1 || true
          if ! grep -q Success reports/install.txt; then
            echo "BLOCKED: original split install failed" | tee reports/verdict.txt
            exit 0
          fi
          adb -s 127.0.0.1:5555 shell pm list packages -3 > reports/packages.txt 2>&1 || true
          adb -s 127.0.0.1:5555 shell monkey -p com.catsbit.oxidesurvivalisland 1 > reports/launch.txt 2>&1 || true
          for i in 0 10 35; do
            if [ "$i" -gt 0 ]; then sleep "$((i == 10 ? 10 : 25))"; fi
            adb -s 127.0.0.1:5555 shell dumpsys activity activities > "reports/activity-${i}.txt" 2>&1 || true
            adb -s 127.0.0.1:5555 shell pidof com.catsbit.oxidesurvivalisland > "reports/pid-${i}.txt" 2>&1 || true
            adb -s 127.0.0.1:5555 shell screencap -p > "reports/screen-${i}.png" 2>/dev/null || true
          done
          adb -s 127.0.0.1:5555 logcat -d -v threadtime > reports/logcat.txt 2>&1 || true
          echo "UNVERIFIED: inspect PID, activity and screenshots; no gameplay claim" > reports/verdict.txt
      - name: Collect evidence even on failure
        if: always()
        run: |
          mkdir -p reports
          docker logs oxide-android > reports/container.log 2>&1 || true
          docker ps -a > reports/containers.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oxide-115-arm64-runtime-evidence
          path: |
            reports/
            original-apk-inventory.json
          retention-days: 7
