name: Oxide 1.15 ARM64 virtual runtime probe
run-name: Oxide Android ${{ inputs.android_version || '15' }} run
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Native ARM64 runner validated by the host matrix
        required: true
        type: choice
        default: ubuntu-24.04-arm
        options:
          - ubuntu-24.04-arm
          - ubuntu-22.04-arm
      android_version:
        description: Native ARM64 Android guest version for compatibility comparison
        required: true
        type: choice
        default: '15'
        options:
          - '15'
          - '16'
jobs:
  runtime:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04-arm' }}
    timeout-minutes: 50
    env:
      ANDROID_VERSION: ${{ inputs.android_version || '15' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check Android Binder support before expensive APK download
        shell: bash
        run: |
          mkdir -p reports
          printf '%s\n' "$ANDROID_VERSION" > reports/android-version.txt
          uname -a > reports/kernel.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" kmod
          sudo modprobe binder_linux devices=binder,hwbinder,vndbinder > reports/modprobe-binder.txt 2>&1 || true
          sudo mkdir -p /dev/binderfs
          if ! mountpoint -q /dev/binderfs; then sudo mount -t binder binder /dev/binderfs > reports/mount-binderfs.txt 2>&1 || true; fi
          sudo chmod a+rw /dev/binderfs/binder 2>/dev/null || true
          ls -la /dev/binderfs > reports/binderfs-ls.txt 2>&1 || true
          sudo modprobe ashmem_linux > reports/modprobe-ashmem.txt 2>&1 || true
          if ! python3 tools/oxide_host_preflight.py --output reports/preflight.json; then
            echo 'BLOCKED_HOST_BINDER: Redroid cannot boot on this hosted kernel' | tee reports/verdict.txt
            exit 1
          fi
      - name: Prepare verified upstream host ashmem for stock Android 16
        if: env.ANDROID_VERSION == '16'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git gcc make kmod "linux-headers-$(uname -r)" "linux-modules-extra-$(uname -r)"
          git init --quiet upstream-module
          git -C upstream-module remote add origin https://github.com/remote-android/redroid-modules.git
          timeout 180 git -C upstream-module fetch --depth=1 origin refs/pull/23/head
          source_sha="$(git -C upstream-module rev-parse FETCH_HEAD)"
          printf '%s\n' "$source_sha" > reports/ashmem-source-sha.txt
          test "$source_sha" = f55e1e7515a6dd5f8e0f9569ea79148c08f60816
          git -C upstream-module checkout --quiet --detach FETCH_HEAD
          make -C upstream-module/ashmem all > reports/ashmem-build.txt 2>&1
          test -s upstream-module/ashmem/ashmem_linux.ko
          modinfo upstream-module/ashmem/ashmem_linux.ko > reports/ashmem-modinfo.txt
          grep -q "^vermagic: *$(uname -r)" reports/ashmem-modinfo.txt
          sudo insmod upstream-module/ashmem/ashmem_linux.ko
          if [ ! -c /dev/ashmem ]; then
            minor="$(awk '$2=="ashmem" {print $1}' /proc/misc)"
            test -n "$minor"
            sudo mknod /dev/ashmem c 10 "$minor"
          fi
          test -c /dev/ashmem
          sudo chmod a+rw /dev/ashmem
          printf 'ASHMEM_DRIVER_READY\n' > reports/ashmem-status.txt
      - name: Boot native Android ARM64 before downloading original APK
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq adb aapt
          image="redroid/redroid:${ANDROID_VERSION}.0.0_64only-latest"
          printf '%s\n' "$image" > reports/android-image.txt
          docker pull "$image" > reports/pull.log 2>&1
          extra=()
          if [ "$ANDROID_VERSION" = '16' ]; then
            test -c /dev/ashmem
            extra=(--device /dev/ashmem:/dev/ashmem)
          fi
          docker run -d --name oxide-android --privileged -p 127.0.0.1:5555:5555 -v /dev/binderfs:/dev/binderfs "${extra[@]}" "$image" androidboot.redroid_width=720 androidboot.redroid_height=1280 androidboot.redroid_dpi=320 androidboot.redroid_gpu_mode=guest > reports/container-id.txt 2> reports/container-error.txt
          for i in $(seq 1 36); do
            adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true
            if adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -qx 1; then break; fi
            sleep 5
          done
          adb -s 127.0.0.1:5555 shell getprop sys.boot_completed > reports/boot.txt 2>&1 || true
          adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abi > reports/abi.txt 2>&1 || true
          if ! tr -d '\r' < reports/boot.txt | grep -qx 1 || ! tr -d '\r' < reports/abi.txt | grep -qx arm64-v8a; then
            echo 'BLOCKED_ANDROID_BOOT_OR_ABI' | tee reports/verdict.txt
            exit 1
          fi
          echo 'BOOT_CONFIRMED_NO_GAME' > reports/verdict.txt
      - name: Download and verify all four unmodified original APKs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release download v1.15.11966 --repo 48348484488/oxide --pattern split_UnityDataAssetPack.apk --dir .
          python3 tools/audit_original_split_hashes.py --output original-apk-inventory.json
          python3 -c "import json; assert json.load(open('original-apk-inventory.json'))['complete']"
          aapt dump badging base.apk > reports/apk-badging.txt
          app_package=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" reports/apk-badging.txt | head -n 1)
          test -n "$app_package"
          app_activity=$(awk -F"'" '/^launchable-activity: name=/ {print $2; exit}' reports/apk-badging.txt)
          test -n "$app_activity"
          echo "APP_PACKAGE=$app_package" >> "$GITHUB_ENV"
          echo "APP_ACTIVITY=$app_activity" >> "$GITHUB_ENV"
      - name: Install, launch and sample original Oxide at 0-4, 10 and 35 seconds
        shell: bash
        run: |
          adb -s 127.0.0.1:5555 install-multiple -r base.apk split_config.arm64_v8a.apk split_config.xxhdpi.apk split_UnityDataAssetPack.apk > reports/install.txt 2>&1
          grep -q Success reports/install.txt
          adb -s 127.0.0.1:5555 shell pm list packages -3 > reports/packages.txt
          adb -s 127.0.0.1:5555 shell am force-stop "$APP_PACKAGE" > reports/force-stop.txt 2>&1 || true
          adb -s 127.0.0.1:5555 logcat -c > reports/logcat-clear.txt 2>&1 || true
          # Dispatch the original Activity and begin capture in the same clock window.
          # A blocking am start -W here previously missed the 0-4 second exit window.
          # Each sample records real monotonic time, not the name of its checkpoint.
          python3 tools/oxide_capture_samples.py --reports reports --package "$APP_PACKAGE" \
            --launch-activity "$APP_PACKAGE/$APP_ACTIVITY"
          adb -s 127.0.0.1:5555 logcat -d -v threadtime > reports/logcat.txt 2>&1 || true
          python3 tools/oxide_runtime_assess.py reports
      - name: Collect results even on failure
        if: always()
        shell: bash
        run: |
          mkdir -p reports
          docker logs oxide-android > reports/container.log 2>&1 || true
          docker ps -a > reports/containers.txt 2>&1 || true
          docker inspect oxide-android > reports/container-inspect.json 2>&1 || true
          cat reports/verdict.txt reports/runtime-verdict.json reports/preflight.json reports/modprobe-binder.txt reports/mount-binderfs.txt 2>/dev/null || true
          tail -n 60 reports/container.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oxide-115-arm64-runtime-evidence
          path: |
            reports/
            original-apk-inventory.json
          retention-days: 7
