name: "Oxide M3-M4 - Original game on native Android 16 with host ashmem"

# Runs four original signed APK splits unmodified on virtual native ARM64.
# Uses a pinned upstream ashmem fix strictly for stock Android 16 boot.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oxide-m3-android16-original-ashmem.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-game-android16:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 65
    env:
      OXIDE_ANDROID_VERSIONS: "16"
      OXIDE_CAPTURE_35S: "1"
      OXIDE_ATTACH_HOST_ASHMEM: "1"
    steps:
      - name: Checkout original verified splits and read-only diagnostics
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            base.apk
            split_config.arm64_v8a.apk
            split_config.xxhdpi.apk
            tools
            tests
      - name: Verify native host, parsers, install routines and script syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          python3 -m unittest discover -s tests -p test_audit_original_new_virtual_android.py -v
          python3 -m unittest discover -s tests -p test_verify_original_splits.py -v
          python3 -m unittest discover -s tests -p test_diagnose_original_exit.py -v
          bash -n tools/run_native_virtual_android_matrix.sh
      - name: Prepare native ARM64 kernel Binder and compile-only validated ashmem source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android16-original-proof
          uname -m > android16-original-proof/host_arch.txt
          uname -r > android16-original-proof/kernel.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git gcc make kmod adb "linux-headers-$(uname -r)" \
            "linux-modules-extra-$(uname -r)"
          sudo modprobe binder_linux devices=binder,hwbinder,vndbinder
          sudo mkdir -p /dev/binderfs
          sudo mount -t binder binder /dev/binderfs
          sudo chmod a+rw /dev/binderfs/binder || true
          git init --quiet upstream-module
          git -C upstream-module remote add origin https://github.com/remote-android/redroid-modules.git
          timeout 180 git -C upstream-module fetch --depth=1 origin refs/pull/23/head
          SHA="$(git -C upstream-module rev-parse FETCH_HEAD)"
          echo "$SHA" > android16-original-proof/ashmem_source_sha.txt
          test "$SHA" = "f55e1e7515a6dd5f8e0f9569ea79148c08f60816"
          git -C upstream-module checkout --quiet --detach FETCH_HEAD
          make -C upstream-module/ashmem all > android16-original-proof/build.txt 2>&1
          test -s upstream-module/ashmem/ashmem_linux.ko
          modinfo upstream-module/ashmem/ashmem_linux.ko > android16-original-proof/modinfo.txt
          grep -q "^vermagic: *$(uname -r)" android16-original-proof/modinfo.txt
          sudo insmod upstream-module/ashmem/ashmem_linux.ko
          if [ ! -c /dev/ashmem ]; then
            minor="$(awk '$2=="ashmem" {print $1}' /proc/misc)"
            test -n "$minor"
            sudo mknod /dev/ashmem c 10 "$minor"
          fi
          test -c /dev/ashmem
          sudo chmod a+rw /dev/ashmem
          echo ASHMEM_DEVICE_REAL > android16-original-proof/ashmem_status.txt
      - name: Fetch exact original large Unity resource split, verify SHA256
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 \
            --max-time 1200 --silent --show-error \
            --output split_UnityDataAssetPack.apk \
            "https://github.com/48348484488/oxide/releases/download/v1.0.0/split_UnityDataAssetPack.apk"
          echo "2f0f7f1be7d78d269f710edd471c40a9755a93a07481cae0c058356515e19834  split_UnityDataAssetPack.apk" | sha256sum --check
          python3 tools/verify_original_splits.py . --output android16-original-proof/original_apk_sha256.json
      - name: Run unchanged ORIGINAL Oxide in native virtual Android 16 with 35s checkpoints
        shell: bash
        run: |
          set -euo pipefail
          bash tools/run_native_virtual_android_matrix.sh . android16-original-proof
      - name: Classify original Android16 process and Activity, not an analytics service
        shell: bash
        run: |
          set -euo pipefail
          test -s android16-original-proof/raw_version_states.json
          python3 tools/audit_original_new_virtual_android.py \
            --version 16 --input android16-original-proof/raw_version_states.json \
            --out android16-original-proof/original-lifecycle-audit
      - name: Report truthful original-game and virtual boot result
        if: always()
        shell: bash
        run: |
          {
            echo "## Original Oxide Android 16 ARM64, stock guest and host ashmem"
            echo "Host ashmem status: $(cat android16-original-proof/ashmem_status.txt 2>/dev/null || echo UNKNOWN)"
            if [ -s android16-original-proof/original-lifecycle-audit/original_game_lifecycle.md ]; then
              cat android16-original-proof/original-lifecycle-audit/original_game_lifecycle.md
            else
              echo 'Incomplete game evidence; no original game survival or security cause proven.'
            fi
            echo 'Original APKs unchanged; virtual-only, no spoofing or integrity bypass.'
            echo 'A CI job success is not proof of gameplay or real-player ESP.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep original-game process evidence, not signed APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oxide-original-android16-arm64-ashmem-35s-proof
          path: |
            android16-original-proof/*.json
            android16-original-proof/*.txt
            android16-original-proof/*.md
            android16-original-proof/original-lifecycle-audit/
            android16-original-proof/android_16/*.txt
            android16-original-proof/android_16/*.json
            android16-original-proof/android_16/*.png
          if-no-files-found: warn
          retention-days: 14
