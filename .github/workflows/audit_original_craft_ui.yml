name: Locate real Unity crafting inventory UI
on:
  workflow_dispatch:
  push:
    paths:
      - tools/audit_original_craft_ui.py
      - .github/workflows/audit_original_craft_ui.yml
permissions:
  contents: read
jobs:
  source-craft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            xapk_original
            tools/audit_original_craft_ui.py
          filter: blob:none
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read original manufacturing assets
        env:
          INSPECT_UI: '1'
        run: |
          python -m pip install -q UnityPy
          python -u tools/audit_original_craft_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Original-Unity-Crafting-UI-Inventory
          path: source_ui_craft_index.json
