name: Exhaustively scan original Unity base wall and foundation meshes
on:
  workflow_dispatch:
  push:
    paths:
      - tools/locate_original_base_meshes.py
      - .github/workflows/locate_original_base_meshes.yml
permissions:
  contents: read
jobs:
  source-mesh-locator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            xapk_original
            tools/locate_original_base_meshes.py
          filter: blob:none
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -q UnityPy
          python -u tools/locate_original_base_meshes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Full-Original-Unity-Base-Mesh-Search
          path: original_base_mesh_source_index.json
          if-no-files-found: warn
