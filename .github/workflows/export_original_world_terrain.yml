name: Restore authentic LITE terrain sectors from XAPK
on:
  workflow_dispatch:
  push:
    paths:
      - tools/export_original_world_terrain.py
      - .github/workflows/export_original_world_terrain.yml
permissions:
  contents: write
jobs:
  extract-world:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            xapk_original
            tools/export_original_world_terrain.py
            last_island_recreated_game/assets/original_world
          filter: blob:none
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet UnityPy
      - name: Recover actual source world sector mesh, texture and positions
        run: python -u tools/export_original_world_terrain.py
      - name: Store authentic terrain geometry in the project
        run: |
          git config user.name "lios-terrain-recovery[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f last_island_recreated_game/assets/original_world/
          if git diff --cached --quiet; then
            echo 'No terrain changes'
          else
            git commit -m "Recover original 6000m island sector meshes, maps and Unity textures"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LITE-Original-World-Source-Geometry
          path: |
            last_island_recreated_game/assets/original_world/map_tiles.txt
            last_island_recreated_game/assets/original_world/export_report.json
          if-no-files-found: warn
          retention-days: 30
