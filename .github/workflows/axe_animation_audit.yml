name: Inspect original axe holding animations

on:
  push:
    branches: [main]
    paths:
      - "tools/audit_axe_animations.py"
      - ".github/workflows/axe_animation_audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-original-animation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install read-only analyzers
        run: python -m pip install "numpy==1.26.4" "UnityPy>=1.20,<2"
      - name: Identify original holding, idle, weapon and attack clips
        run: python tools/audit_axe_animations.py
      - name: Preserve inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-animation-original-clip-audit
          path: axe_animation_audit.json
          if-no-files-found: warn
