name: Oxide ARM64 host choice - two verified tiny JSONs, never APK
on:
  push:
    branches: [main]
    paths:
      - 'tools/oxide_arm64_host_selection_gate.py'
      - 'tests/test_oxide_arm64_host_selection_gate.py'
      - '.github/workflows/oxide-arm64-host-choice-from-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: oxide-arm64-host-choice-${{ github.ref }}
  cancel-in-progress: false

jobs:
  choose-from-existing-no-emulator-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            tools
            tests

      - name: Ten synthetic fail-closed gating regressions
        run: |
          set -euo pipefail
          python3 -m compileall -q tools/oxide_arm64_host_selection_gate.py tests/test_oxide_arm64_host_selection_gate.py
          python3 -m unittest discover -s tests -p 'test_oxide_arm64_host_selection_gate.py' -v

      - name: Preflight exact two prior tiny host artifacts before any download
        run: |
          set -euo pipefail
          mkdir -p evidence/linux evidence/windows reports
          gh api repos/48348484488/oxide/actions/artifacts/12045616396 > "$RUNNER_TEMP/linux.json"
          gh api repos/48348484488/oxide/actions/artifacts/12045413355 > "$RUNNER_TEMP/windows.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          pairs=[
              ("linux",12045616396,38899371688,"oxide-ubuntu26-arm64-kvm-only-preflight"),
              ("windows",12045413355,38899889965,"oxide-windows-arm64-whpx-only-preflight"),
          ]
          for name,artifact,run,title in pairs:
              info=json.loads((Path(os.environ["RUNNER_TEMP"])/(name+".json")).read_text())
              assert info["id"]==artifact
              assert info["workflow_run"]["id"]==run
              assert info["name"]==title
              assert info["expired"] is False
              assert 0<info["size_in_bytes"]<50000
              print(name,"existing host-only evidence",info["size_in_bytes"],"bytes")
          PY

      - name: Download only original host JSON records - NO Android or Oxide
        run: |
          set -euo pipefail
          gh run download 38899371688 --repo 48348484488/oxide \
            --name oxide-ubuntu26-arm64-kvm-only-preflight --dir evidence/linux
          gh run download 38899889965 --repo 48348484488/oxide \
            --name oxide-windows-arm64-whpx-only-preflight --dir evidence/windows
          python3 - <<'PY'
          from pathlib import Path
          for key,filename in (
              ("linux","oxide-ubuntu26-arm64-kvm-host-preflight.json"),
              ("windows","windows-arm64-whpx-preflight.json"),
          ):
              files=list((Path("evidence")/key).rglob(filename))
              assert len(files)==1, (key, files)
              (Path("reports")/(key+"-path.txt")).write_text(str(files[0]))
          PY
          python3 tools/oxide_arm64_host_selection_gate.py \
            --linux-json "$(cat reports/linux-path.txt)" \
            --windows-json "$(cat reports/windows-path.txt)" \
            --output reports/original-arm64-host-acceleration-decision.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          v=json.loads(Path("reports/original-arm64-host-acceleration-decision.json").read_text())
          assert v["evidence_validated"] is True
          assert v["status"]=="BOTH_NEW_ARM64_RUNNERS_LACK_HYPERVISOR_ACCELERATION"
          assert v["linux_ubuntu26"]["kvm"]=="DEVICE_ABSENT"
          assert v["windows_arm64_vs2026"]["whpx_hypervisor_present"] is False
          assert v["native_arm64_vm_acceleration_prerequisite_met"] is False
          assert v["heavy_android_or_apk_trial_authorized"] is False
          assert v["gameplay_verified"] is False
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as f:
              f.write("### Native ARM64 Android acceleration host selection (reused metadata only)\n")
              f.write("- Ubuntu26 ARM64: /dev/kvm missing, KVM API12 impossible\n")
              f.write("- Windows11 ARM64: WHPX HypervisorPresent=false\n")
              f.write("- Both new hosted runner accelerated-VM options: BLOCKED\n")
              f.write("- No APK, Android, proprietary bin, or virtual machine downloaded or run\n")
              f.write("- No emulator certification, Play Integrity or game acceptance inferred\n")
          PY

      - name: Upload only derived decision and source SHA256s
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oxide-new-arm64-host-availability-failclosed-decision
          path: reports/original-arm64-host-acceleration-decision.json
          if-no-files-found: warn
          retention-days: 14

      - name: Record negative host result and stopping decision in M3 once
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ job.status }}
        with:
          script: |
            const {owner,repo}=context.repo;
            const marker='<!-- oxide-both-arm64-hosts-failclosed:'+context.runId+' -->';
            const comments=await github.paginate(github.rest.issues.listComments,{
              owner,repo,issue_number:3,per_page:100
            });
            if(comments.some(c=>c.body?.includes(marker))) return;
            const fs=require('fs'), p='reports/original-arm64-host-acceleration-decision.json';
            const v=fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')):{};
            const body=marker+
              '\n**Seleção de hosts nativos ARM64 usando somente dois JSONs existentes:** '+process.env.RESULT+
              '\nRun: https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId+
              '\nVeredito: **'+String(v.status||'NO_VERIFIED_DECISION')+'**'+
              '\nPróxima ação: '+String(v.next_action||'BLOCKED')+
              '\nTrial Android/APK pesado autorizado: '+String(v.heavy_android_or_apk_trial_authorized??false)+
              '\nNenhuma instalação, boot, edição de APK, alteração do hipervisor ou bypass.';
            await github.rest.issues.createComment({owner,repo,issue_number:3,body});
