name: Install original axe assets into game folder
on:
  push:
    branches: [main]
    paths:
      - tools/package_original_axe_for_game.py
      - .github/workflows/install_original_axe_in_game.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package-into-game:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install asset tooling
        run: python -m pip install "UnityPy>=1.20,<2" numpy trimesh Pillow
      - name: Rebuild source-derived 3D animations
        run: python tools/export_original_stone_axe_3d.py
      - name: Verify game matrix and package for another AI
        run: python tools/package_original_axe_for_game.py
      - name: Commit playable game's asset pack to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_island_recreated_game/importar_machado_original/
          if git diff --staged --quiet; then
            echo "Asset pack already synchronized."
          else
            git commit -m "Add original stone axe GLB animation pack to recreated game"
            git push
          fi
      - name: Preserve downloadable package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-island-original-axe-ready-for-game
          path: last_island_recreated_game/importar_machado_original/
          if-no-files-found: warn
