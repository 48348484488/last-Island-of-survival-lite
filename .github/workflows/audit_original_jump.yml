name: Audit original jump, airborne and landing clips
on:
  push:
    paths: [tools/audit_original_jump.py,.github/workflows/audit_original_jump.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy trimesh "UnityPy>=1.20,<2"
      - run: python tools/audit_original_jump.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-jump-source-audit
          path: jump_original_audit/
