name: Oxide M4 original APK on verified official ARM64 TCG (one attempt)
# ARCHIVED after original-game failures; no automatic replay of costly APK/AVD trials.
# A future distinct hypothesis requires a NEW preflight and review.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: oxide-official-arm64-tcg-original-one-attempt
  cancel-in-progress: false

jobs:
  unchanged-original-after-real-boot:
    # Permanently skip this historical automatic single-use trial.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    env:
      ANDROID_I_WANT_MY_TCG: "yes"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Confirm predecessor finished with verified official Android boot evidence
        env:
          BOOT_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          # Fail closed: workflow_run success alone is not a boot proof.
          gh api "repos/48348484488/oxide/actions/runs/$BOOT_RUN_ID/artifacts" \
            --jq '.artifacts[].name' > reports/predecessor-artifacts.txt
          grep -Fxq 'oxide-official-arm64-android15-tcg-boot-evidence' \
            reports/predecessor-artifacts.txt
          mkdir -p predecessor
          gh run download "$BOOT_RUN_ID" --repo 48348484488/oxide \
            --name oxide-official-arm64-android15-tcg-boot-evidence \
            --dir predecessor
          python3 - <<'PY'
          from pathlib import Path
          p = Path("predecessor")
          required = {"boot.txt": "1", "abi.txt": "arm64-v8a",
                      "status.txt": "OFFICIAL_TCG_ARM64_BOOT_VERIFIED_NO_APK"}
          for name, value in required.items():
              assert (p / name).read_text().strip() == value, name
          assert (p / "managed-arm64-gate.json").is_file()
          import json
          result = json.loads((p / "managed-arm64-gate.json").read_text())
          assert result["proceed_with_original_apk_download"] is True
          assert result["gameplay_confirmed"] is False
          print("Official emulator boot and ARM64 package prerequisites verified; original APK not yet tested.")
          PY
          echo 'OFFICIAL_BOOT_PREDECESSOR_VERIFIED' > reports/trial-stage.txt

      - name: Launch same official image again and test unchanged original Oxide APK once
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: arm64-v8a
          profile: pixel_7
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          emulator-boot-timeout: 650
          disable-linux-hw-accel: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel off
          script: bash tools/oxide_official_arm64_game_trial.sh emulator-5554 reports

      - name: Retain original unchanged APK evidence even on crash/timeout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oxide-original-apk-on-official-arm64-tcg-evidence
          path: reports/
          retention-days: 14
          if-no-files-found: warn
