name: Audit original Unity crouch and prone animations
on:
  workflow_dispatch:
  push:
    paths:
      - tools/audit_original_stances.py
      - .github/workflows/audit_original_stances.yml
permissions:
  contents: read
jobs:
  audit-original-animator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/audit_original_stances.py
            raw_assets/assets/role/animationbundle.ab
            raw_assets/assets/role/role.ab
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read original Unity serialized animation bundle and AnimatorController
        run: |
          python -m pip install --quiet UnityPy
          python -u tools/audit_original_stances.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Original-Unity-Stance-Audit
          path: stance_source_audit.json
          if-no-files-found: warn
