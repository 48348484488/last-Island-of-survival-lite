name: Inspect original Unity terrain meshes and build asset packs
on:
  workflow_dispatch:
  push:
    paths:
      - tools/audit_original_terrain_mesh.py
      - .github/workflows/audit_original_terrain_mesh.yml
permissions:
  contents: read
jobs:
  original-terrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/audit_original_terrain_mesh.py
            xapk_original
          filter: blob:none
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet UnityPy
      - name: Read original terrain meshes and construction prefabs index
        run: python -u tools/audit_original_terrain_mesh.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LIOS-Original-Terrain-Mesh-Inventory
          path: original_terrain_mesh_audit.json
          retention-days: 30
          if-no-files-found: warn
