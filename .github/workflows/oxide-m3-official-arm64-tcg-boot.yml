name: Oxide M3 official ARM64 Play Android software boot (no account)
on:
  push:
    paths:
      - '.github/workflows/oxide-m3-official-arm64-tcg-boot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oxide-official-arm64-tcg-boot-only
  cancel-in-progress: false

jobs:
  arm64-play-tcg-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Official Android Emulator documentation: explicit opt-in to unsupported slow TCG.
      ANDROID_I_WANT_MY_TCG: "yes"
    steps:
      - uses: actions/checkout@v4

      - name: Boot official Google Play ARM64 Android 15 using software emulation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: arm64-v8a
          profile: pixel_7
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          emulator-boot-timeout: 650
          disable-linux-hw-accel: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel off
          script: |
            set -euo pipefail
            mkdir -p reports
            adb shell getprop sys.boot_completed > reports/boot.txt
            adb shell getprop ro.product.cpu.abi > reports/abi.txt
            adb shell getprop ro.build.version.release > reports/version.txt
            adb shell pm path com.android.vending > reports/play-store-pm-path.txt 2>&1 || true
            adb shell pm path com.google.android.gms > reports/play-services-pm-path.txt 2>&1 || true
            python3 tools/oxide_managed_arm64_gate.py --reports reports
            adb exec-out screencap -p > reports/official-arm64-boot.png || true
            echo "OFFICIAL_TCG_ARM64_BOOT_VERIFIED_NO_APK" > reports/status.txt

      - name: Retain official boot evidence even on emulator failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oxide-official-arm64-android15-tcg-boot-evidence
          path: reports/
          retention-days: 14
          if-no-files-found: warn
