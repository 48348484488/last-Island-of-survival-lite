name: Oxide Berberis offline regression
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oxide-berberis-offline-ci.yml'
      - 'tools/oxide_berberis_logcat_audit.py'
      - 'tools/oxide_exit_timeline.py'
      - 'tests/test_oxide_berberis_logcat_audit.py'
      - 'tests/test_oxide_exit_timeline.py'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: oxide-berberis-offline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile offline auditors
        run: python3 -m compileall -q tools/oxide_berberis_logcat_audit.py tools/oxide_exit_timeline.py tests/test_oxide_berberis_logcat_audit.py tests/test_oxide_exit_timeline.py
      - name: Test Berberis opcode chronology
        run: python3 -m unittest discover -s tests -p 'test_oxide_berberis_logcat_audit.py' -v
      - name: Test original Android exit timelines
        run: python3 -m unittest discover -s tests -p 'test_oxide_exit_timeline.py' -v
      - name: Record reproducible CI result in M4
        if: always()
        uses: actions/github-script@v7
        env:
          TEST_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const marker = '<!-- oxide-berberis-offline:' + context.runId + ' -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: 4, per_page: 100
            });
            if (comments.some(c => c.body?.includes(marker))) return;
            const status = process.env.TEST_JOB_STATUS;
            const body = marker + '\n' +
              '**CI offline Berberis / timeline:** ' + status + '\n' +
              'Run: https://github.com/' + owner + '/' + repo + '/actions/runs/' + context.runId + '\n' +
              'Commit: ' + context.sha + '\n' +
              'Somente testes Python e logcat sintético. Nenhum APK/Android baixado ou executado; ' +
              'o jogo original permanece sem prova de 35 s, menu ou gameplay.';
            await github.rest.issues.createComment({owner, repo, issue_number: 4, body});
