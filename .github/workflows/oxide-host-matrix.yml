name: Oxide virtual Android host candidates
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oxide-host-matrix.yml'
      - 'tools/oxide_host_preflight.py'
      - 'tests/test_oxide_host_preflight.py'
permissions:
  contents: read
jobs:
  preflight-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Binder host decision rules
        run: python3 -m unittest discover -s tests -p 'test_oxide_host_preflight.py' -v
  probe:
    name: Probe ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            abi: arm64-v8a
          - runner: ubuntu-22.04-arm
            abi: arm64-v8a
          - runner: ubuntu-24.04
            abi: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Probe kernel before downloading Android
        shell: bash
        run: |
          mkdir -p reports
          uname -a > reports/kernel.txt
          sudo modprobe binder_linux devices=binder,hwbinder,vndbinder > reports/modprobe-binder.txt 2>&1 || true
          sudo modprobe ashmem_linux > reports/modprobe-ashmem.txt 2>&1 || true
          if ! python3 tools/oxide_host_preflight.py --output reports/preflight.json; then
            echo HOST_NO_BINDER > reports/verdict.txt
            cat reports/modprobe-binder.txt
            exit 1
          fi
      - name: Attempt genuine Android container boot (no APK)
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq adb
          docker pull redroid/redroid:13.0.0-latest > reports/pull.txt 2>&1
          docker run -d --name oxide-host-probe --privileged -p 5555:5555 redroid/redroid:13.0.0-latest androidboot.redroid_width=720 androidboot.redroid_height=1280 androidboot.redroid_dpi=320 androidboot.redroid_gpu_mode=guest > reports/container-id.txt 2> reports/container-error.txt
          for i in $(seq 1 24); do
            adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true
            if adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -qx 1; then break; fi
            sleep 5
          done
          adb -s 127.0.0.1:5555 shell getprop sys.boot_completed > reports/boot.txt 2>&1 || true
          adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abi > reports/abi.txt 2>&1 || true
          if ! tr -d '\r' < reports/boot.txt | grep -qx 1 || ! tr -d '\r' < reports/abi.txt | grep -qx '${{ matrix.abi }}'; then
            echo ANDROID_BOOT_OR_ABI_FAILED > reports/verdict.txt
            exit 1
          fi
          echo 'HOST_READY_NO_GAME_TEST' > reports/verdict.txt
          echo "Android booted with ABI ${{ matrix.abi }}; no Oxide APK installed"
      - name: Preserve diagnostics on any outcome
        if: always()
        shell: bash
        run: |
          mkdir -p reports
          docker logs oxide-host-probe > reports/container.log 2>&1 || true
          docker ps -a > reports/containers.txt 2>&1 || true
          cat reports/preflight.json reports/verdict.txt reports/container-error.txt 2>/dev/null || true
          tail -n 50 reports/container.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oxide-host-${{ matrix.runner }}
          path: reports/
          retention-days: 7
