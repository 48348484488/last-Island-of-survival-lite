name: Oxide event-driven supervisor
on:
  workflow_run:
    workflows:
      - Oxide 1.15 ARM64 virtual runtime probe
    types: [completed]
permissions:
  actions: read
  issues: write
jobs:
  triage:
    if: ${{ github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Classify completed runtime test and update milestone
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const {owner, repo} = context.repo;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {owner, repo, run_id: run.id});
            const failed = jobs.flatMap(j => j.steps || []).filter(s => s.conclusion === 'failure').map(s => s.name);
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({owner, repo, run_id: run.id});
            const names = artifacts.data.artifacts.map(a => a.name);
            const report = [
              '### Supervisor automatico: runtime concluido',
              'Execucao: ' + run.html_url,
              'Resultado CI: ' + run.conclusion,
              'Etapas com falha: ' + (failed.join(', ') || 'nenhuma'),
              'Artefatos: ' + (names.join(', ') || 'nenhum'),
              'Gameplay validado: NAO. Exige PID, activity, screenshots e verificacao dos 35 segundos.',
              'Proxima acao: analisar artefatos e corrigir causa especifica; nao repetir a mesma execucao sem mudanca.',
              'Este supervisor reage imediatamente ao fim do workflow, mas nao inventa patches nem reinicia testes identicos.'
            ].join('\n\n');
            await github.rest.issues.createComment({owner, repo, issue_number: 4, body: report});
