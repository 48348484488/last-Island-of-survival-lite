name: Oxide event-driven supervisor
on:
  workflow_run:
    workflows:
      - Oxide 1.15 ARM64 virtual runtime probe
      - Oxide Android 15 run
      - Oxide Android 16 run
      - Oxide virtual Android host candidates
      - Oxide M3 official ARM64 Play Android software boot (no account)
      - Oxide M4 original APK on verified official ARM64 TCG (one attempt)
      - Oxide M4 original APK on macOS Apple Silicon Android ARM64 (one attempt)
    types: [completed]
permissions:
  actions: write
  issues: write
  contents: read
jobs:
  triage:
    if: ${{ github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download completed workflow diagnostics
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: oxide-*
          path: evidence
          merge-multiple: false
      - name: Classify, record and dispatch next feasible test
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const run = context.payload.workflow_run;
            const {owner, repo} = context.repo;
            const marker = '<!-- oxide-supervisor-run:' + run.id + ' -->';
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number: 4, per_page: 100});
            if (comments.some(c => c.body?.includes(marker))) {
              core.notice('Already processed this run; skip duplicate delivery');
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {owner, repo, run_id: run.id, per_page: 100});
            const files = [];
            function walk(dir) {
              if (!fs.existsSync(dir)) return;
              for (const child of fs.readdirSync(dir, {withFileTypes: true})) {
                const p = path.join(dir, child.name);
                if (child.isDirectory()) walk(p);
                else if (['verdict.txt', 'preflight.json', 'runtime-verdict.json', 'abi.txt', 'status.txt', 'managed-arm64-gate.json', 'trial-stage.txt', 'oxide-exit-timeline.json'].includes(child.name)) files.push(p);
              }
            }
            walk('evidence');
            const observations = files.sort().map(p => {
              const content = fs.readFileSync(p, 'utf8').trim();
              if (p.endsWith('preflight.json') || p.endsWith('runtime-verdict.json') ||
                  p.endsWith('managed-arm64-gate.json') || p.endsWith('oxide-exit-timeline.json')) {
                try {
                  const v = JSON.parse(content);
                  return p + ': ' + (v.status || v.next_action || 'unknown') +
                    ' (binder_ready=' + (v.binder_ready ?? 'unknown') + ', gameplay_confirmed=' + (v.gameplay_confirmed ?? false) + ')';
                } catch (_) { return p + ': malformed JSON'; }
              }
              return p + ': ' + content.slice(0, 200);
            });
            let action = 'No safe automatic remediation is known; inspect the evidence and do not repeat identical failed tests.';
            const isMatrix = run.name === 'Oxide virtual Android host candidates';
            const isRuntime = (run.path || '').endsWith('/oxide-115-arm64-runtime.yml') ||
              run.name === 'Oxide 1.15 ARM64 virtual runtime probe' ||
              run.name.startsWith('Oxide Android ');
            const isOfficialBoot = run.name === 'Oxide M3 official ARM64 Play Android software boot (no account)';
            const isOfficialGame = run.name === 'Oxide M4 original APK on verified official ARM64 TCG (one attempt)' ||
              run.name === 'Oxide M4 original APK on macOS Apple Silicon Android ARM64 (one attempt)';
            if (isOfficialBoot) {
              const bootProof = observations.some(x => x.includes('status.txt: OFFICIAL_TCG_ARM64_BOOT_VERIFIED_NO_APK'));
              const packageProof = observations.some(x => x.includes('ARM64_GOOGLE_PACKAGES_PRESENT_TRUST_UNVERIFIED'));
              if (run.conclusion === 'success' && bootProof && packageProof) {
                action = 'Official ARM64 Google Play AVD boot evidence confirmed. The separate event-driven original APK workflow handles the single next attempt; no duplicate dispatch here.';
              } else {
                action = 'Official ARM64 software boot NOT verified (runner ' + run.conclusion +
                  '). Do not download Oxide or schedule endless expensive retries. Inspect emulator startup logs before another hypothesis.';
              }
            } else if (isOfficialGame) {
              const hostBlocked = observations.some(x => x.includes('BLOCKED_HVF_VM_CREATE_NO_EMULATOR_OR_APK_DOWNLOAD'));
              const stable = observations.some(x => x.includes('PID_STABLE_35S_MENU_NOT_YET_REVIEWED'));
              const failed = observations.some(x => x.includes('FAILED_PID_STABILITY_35S') ||
                x.includes('ORIGINAL_SELF_SIGKILL') || x.includes('TASK_CLOSE_PRECEDES_ORIGINAL_SELF_SIGKILL'));
              action = hostBlocked ?
                'BLOCKED_HVF_UNSUPPORTED: native Apple Silicon GitHub VM cannot create nested Hypervisor VM. Android did not boot and no original APK was installed. No paid account or repeat heavy download.' :
                stable ?
                'Original Oxide PID and Activity survived checks, but menu/gameplay still require human visual evidence review. Do not count game or ESP as verified.' :
                (failed ?
                  'Original Oxide Activity failed lifecycle stability on official ARM64 emulator; inspect logcat and visuals, without bypass or retries.' :
                  'Original Android APK trial did not prove 35-second stability. Review the stage and artifacts; do not rerun automatically.');
            } else if (isMatrix) {
              const candidates = ['ubuntu-24.04-arm', 'ubuntu-22.04-arm'];
              const available = candidates.filter(runner =>
                jobs.some(j => j.name === 'Probe ' + runner && j.conclusion === 'success'));
              if (available.length) {
                const runner = available[0];
                const previous = await github.rest.actions.listWorkflowRuns({
                  owner, repo, workflow_id: 'oxide-115-arm64-runtime.yml', per_page: 20
                });
                const newer = previous.data.workflow_runs.find(x =>
                  Date.parse(x.created_at) >= Date.parse(run.created_at));
                if (newer) {
                  action = 'Native ' + runner + ' is viable; runtime already launched since matrix began: ' +
                    newer.html_url + '. Do not download the 910 MB APK twice.';
                } else {
                  await github.rest.actions.createWorkflowDispatch({
                    owner, repo, workflow_id: 'oxide-115-arm64-runtime.yml',
                    ref: context.payload.repository.default_branch,
                    inputs: {runner}
                  });
                  action = 'Dispatched real original-APK runtime probe on validated native host ' + runner + '.';
                }
              } else {
                action = 'No native ARM64 Redroid host was proven viable. Stopped automatically to avoid expensive endless retries. x86 results do not prove ARM64 game compatibility.';
              }
            } else if (isRuntime && run.conclusion === 'failure') {
              const hostFailed = observations.some(x =>
                x.includes('HOST_NO_BINDER') || x.includes('BLOCKED_HOST_BINDER') || x.includes('BLOCKED_ANDROID_BOOT'));
              if (!hostFailed) {
                action = 'Native Android already booted or host failure not established. Do not repeat kernel probes; analyze original app launch/logcat/Activity evidence instead.';
              } else {
              const recent = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'oxide-host-matrix.yml', per_page: 20
              });
              const latest = recent.data.workflow_runs[0];
              const age = latest ? Date.now() - Date.parse(latest.created_at) : Infinity;
              if (age > 6 * 60 * 60 * 1000) {
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo, workflow_id: 'oxide-host-matrix.yml',
                  ref: context.payload.repository.default_branch
                });
                action = 'Dispatched fresh host-compatibility matrix. Runtime APK is not retried on an unvalidated kernel.';
              } else {
                action = 'Recent host matrix already exists: ' + (latest?.html_url || '') + '. No duplicate retries.';
              }
              }
            } else if (isRuntime && run.conclusion === 'success') {
              action = 'Review screenshot/menu evidence; green CI or a stable PID alone is not proof of playable game or ESP.';
            }
            if (isRuntime) {
              // An explicit workflow_dispatch starts a new event-driven goal analysis.
              // Never pretend that a successful CI job proves gameplay.
              const archive = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: run.id
              });
              const hasEvidence = archive.data.artifacts.some(a => a.name === 'oxide-115-arm64-runtime-evidence');
              if (hasEvidence) {
                const previousForensics = await github.rest.actions.listWorkflowRuns({
                  owner, repo, workflow_id: 'oxide-goal-forensics.yml', per_page: 100
                });
                const markerForRun = 'Oxide goals for runtime #' + run.id;
                if (!previousForensics.data.workflow_runs.some(x => x.display_title === markerForRun)) {
                  await github.rest.actions.createWorkflowDispatch({
                    owner, repo,
                    workflow_id: 'oxide-goal-forensics.yml',
                    ref: context.payload.repository.default_branch,
                    inputs: {runtime_run_id: String(run.id)}
                  });
                  action += ' | Next goal evidence analysis automatically launched for #' + run.id + '.';
                } else {
                  action += ' | Forensics already launched; no duplicate run.';
                }
              } else {
                action += ' | No original runtime archive: goals remain unverified.';
              }
            }
            const report = [
              marker,
              '### Oxide AutoDev — conclusao de execucao',
              'Workflow: **' + run.name + '**',
              'Execucao: ' + run.html_url,
              'Resultado CI: **' + run.conclusion + '**',
              'Jobs: ' + jobs.map(j => j.name + '=' + j.conclusion).join('; '),
              'Diagnosticos: \n' + (observations.length ? observations.map(x => '- ' + x).join('\n') : '- Nenhum arquivo de verdict disponivel'),
              '**Proxima acao:** ' + action,
              'Jogo/ESP: nao considerar validados ate verificar execucao real e imagens.'
            ].join('\n\n');
            await github.rest.issues.createComment({owner, repo, issue_number: 4, body: report});
            core.notice(action);
