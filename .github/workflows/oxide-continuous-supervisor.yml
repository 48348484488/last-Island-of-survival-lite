name: "Oxide - Auto-continue events and stuck-run watchdog"

# Work completion is event-driven; only the watchdog is scheduled.
# Workflow does not generate code and never touches proprietary APKs.
on:
  workflow_run:
    workflows:
      - "Oxide native ARM64 virtual signal observability preflight"
      - "Oxide M1-M2 - ARM64 signal evidence regression"
      - "Oxide M3 - Compare original native ARM64 Android 12-14 archived evidence"
      - "Oxide M3 - Native virtual Android 15 and 16 boot compatibility"
      - "Oxide M3 - Android 16 ARM64 real boot failure diagnostics"
      - "Oxide M3-M4 - Original unchanged game on native virtual Android 15"
      - "Oxide virtual-only ARM64 Android 15 standalone overlay compatibility"
      - "Oxide M5 - Original Oxide and standalone JNI overlay on native Android 16 ARM64"
      - "Oxide M3 - Android 16 ARM64 host ashmem prerequisite diagnosis"
      - "Oxide M3 - Compile-only ashmem Linux 6.17 ARM64 compatibility proof"
      - "Oxide M3 - Validate stock Android 16 ARM64 boot with upstream ashmem"
      - "Oxide M3-M4 - Original game on native Android 16 with host ashmem"
      - "Oxide M1-M4 - Original Activity finish self-SIGKILL independent three-version proof"
      - "Oxide M4 - Observe original Android16 Activity finish Binder IPC without APK modifications"
      - "Oxide M4 - Independent replay of original finishActivity Binder endpoint versus stock Settings control"
      - "Oxide M4 - Verify task-removal finish reason from archived original game and Settings control"
      - "Oxide M4 - Prove ARM64 host userspace call stacks before touching original APK"
      - "Oxide M4 - Capture original Android16 Binder finish and self SIGKILL userspace call stacks"
      - "Oxide M4 - Replay real Android16 original Binder and SIGKILL userspace stack module offsets"
      - "Oxide M4 - Inventory stock Linux ARM64 Binder observability without launching game"
      - "Oxide original APK on native ARM64 Android container"
      - "Native Apple Silicon ARM64 Google Play Android emulator boot probe"
      - "Official native ARM64 Google Play image and host availability audit"
      - "Oxide original ARM64 startup milestones - 3 archived runs"
      - "Oxide original loading-screen overlay interop on native ARM64"
    types: [completed]
  issues:
    types: [closed]
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/oxide-continuous-supervisor.yml"
      - "tools/oxide_continuous_supervisor.py"
      - "tests/test_oxide_continuous_supervisor.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: oxide-supervisor-${{ github.event_name }}-${{ github.event.workflow_run.id || github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  watchdog:
    name: Observe completion / hand off safe tasks / detect stalled runs
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact supervisor implementation
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools
            tests
      - name: Unit-test event handling and fail-closed guards
        run: python3 -m unittest discover -s tests -p 'test_oxide_continuous_supervisor.py' -v
      - name: Process incoming workflow completion, issue transition, or watchdog scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 tools/oxide_continuous_supervisor.py
      - name: Explain automation boundaries
        if: always()
        shell: bash
        run: |
          {
            echo "## Oxide event-driven continuation"
            echo "Trigger: $GITHUB_EVENT_NAME"
            echo "A successful CI run does not establish playable Oxide or close a milestone."
            echo "Watchdog only alerts when jobs appear stuck; never bypasses integrity/security checks."
            echo "There is NO autonomously authenticated AI coding agent in this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
