name: Oxide AutoDev deterministic tests
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oxide-autodev-tests.yml'
      - 'tools/oxide_host_preflight.py'
      - 'tools/oxide_runtime_assess.py'
      - 'tools/oxide_runtime_environment.py'
      - 'tools/oxide_virtual_host_gate.py'
      - 'tools/oxide_official_arm64_play_catalog.py'
      - 'tools/oxide_mac_hvf_vm_create.c'
      - 'tools/oxide_mac_hvf_entitlements.plist'
      - 'tools/oxide_process_timeout.py'
      - 'tools/oxide_official_arm64_game_trial.sh'
      - 'tools/oxide_managed_arm64_gate.py'
      - 'tools/oxide_original_hash_gate.py'
      - 'tools/oxide_exit_timeline.py'
      - 'tools/oxide_capture_samples.py'
      - 'tools/oxide_capture_timing_gate.py'
      - 'tools/oxide_goal_engine.py'
      - 'tools/oxide_activity_binding.py'
      - 'tools/oxide_activity_binding_audit.py'
      - 'goals/oxide-goals.json'
      - 'tests/test_oxide_goal_engine.py'
      - 'tests/test_oxide_activity_binding.py'
      - 'tests/test_oxide_activity_binding_audit.py'
      - 'tests/test_oxide_x86_native_bridge_preflight.py'
      - 'tests/test_oxide_nativebridge_probe.py'
      - 'tests/test_oxide_nativebridge_probe_shell.py'
      - 'tests/test_oxide_nativebridge_handoff.py'
      - 'tests/test_oxide_kvm_recovery_once.py'
      - '.github/workflows/oxide-m4-x86-nativebridge-kvm-recovery-once.yml'
      - '.github/workflows/oxide-m3-x86-arm64-jni-smoke-once.yml'
      - '.github/workflows/oxide-m4-x86-arm64-nativebridge-original-on-success.yml'
      - 'tools/oxide_nativebridge_probe/**'
      - '.github/workflows/oxide-m3-nativebridge-apk-build.yml'
      - '.github/workflows/oxide-m3-x86-arm64-bridge-preflight.yml'
      - 'tests/test_oxide_host_preflight.py'
      - 'tests/test_oxide_runtime_assess.py'
      - 'tests/test_oxide_runtime_environment.py'
      - 'tests/test_oxide_virtual_host_gate.py'
      - 'tests/test_oxide_official_arm64_play_catalog.py'
      - 'tests/test_oxide_official_arm64_trial.py'
      - 'tests/test_oxide_verified_boot_handoff.py'
      - 'tests/test_oxide_macos_original_trial.py'
      - 'tests/test_oxide_macos_arm64_tcg.py'
      - '.github/workflows/oxide-m3-macos-arm64-tcg-preflight.yml'
      - '.github/workflows/oxide-m3-macos-arm64-tcg-boot-once.yml'
      - 'tests/test_oxide_macos_hvf_gate.py'
      - 'tests/test_oxide_process_timeout.py'
      - '.github/workflows/oxide-m3-macos-hvf-create-preflight.yml'
      - '.github/workflows/oxide-m3-macos-arm64-host.yml'
      - '.github/workflows/oxide-m4-macos-arm64-original.yml'
      - '.github/workflows/oxide-m3-official-arm64-tcg-boot.yml'
      - '.github/workflows/oxide-m4-official-arm64-original-on-boot.yml'
      - '.github/workflows/oxide-event-supervisor.yml'
      - 'tests/test_oxide_managed_arm64_gate.py'
      - 'tests/test_oxide_original_hash_gate.py'
      - 'tests/test_oxide_managed_trial_workflow.py'
      - 'tests/test_oxide_exit_timeline.py'
      - 'tests/test_oxide_capture_samples.py'
      - 'tests/test_oxide_async_launch_workflows.py'
      - 'tests/test_oxide_capture_timing_gate.py'
permissions:
  contents: read
jobs:
  deterministic-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Binder probe and original-game evidence classification
        run: python3 -m unittest discover -s tests -p 'test_oxide_*.py' -v
