name: Oxide AutoDev deterministic tests
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oxide-autodev-tests.yml'
      - 'tools/oxide_host_preflight.py'
      - 'tools/oxide_runtime_assess.py'
      - 'tests/test_oxide_host_preflight.py'
      - 'tests/test_oxide_runtime_assess.py'
permissions:
  contents: read
jobs:
  deterministic-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Binder probe and original-game evidence classification
        run: python3 -m unittest discover -s tests -p 'test_oxide_*.py' -v
