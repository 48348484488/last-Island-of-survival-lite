name: Verify 3D game's HUD against genuine prefab image bindings
on:
  push:
    paths: [tools/verify_real_hud_bindings.py,.github/workflows/verify_real_hud_bindings.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  compare-original:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install Pillow
      - name: Audit each source Sprite PPtr; test corrected game HUD
        run: python -u tools/verify_real_hud_bindings.py
      - name: Commit actual Unity prefab evidence into game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_island_recreated_game/assets/hud_original_xapk/auditoria_hud_botoes_vinculados.*
          if ! git diff --staged --quiet; then
            git commit -m "Document verified original Unity HUD prefab controls and fix 7-slot inventory"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genuine-hud-button-prefab-proof
          path: |
            last_island_recreated_game/assets/hud_original_xapk/auditoria_hud_botoes_vinculados.png
            last_island_recreated_game/assets/hud_original_xapk/auditoria_hud_botoes_vinculados.json
          if-no-files-found: warn
