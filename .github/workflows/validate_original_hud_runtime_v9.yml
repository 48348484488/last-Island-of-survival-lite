name: Verify original Unity HUD wired into recreated 3D game (V9)
on:
  push:
    paths:
      - last_island_recreated_game/original_hud_runtime.py
      - last_island_recreated_game/viewer3d.py
      - tools/test_original_hud_runtime.py
      - .github/workflows/validate_original_hud_runtime_v9.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-hud-v9:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow for original XAPK source raster
        run: python -m pip install Pillow
      - name: Compile bridge and actual game entrypoint
        run: |
          python -m py_compile last_island_recreated_game/original_hud_runtime.py
          python -m py_compile last_island_recreated_game/viewer3d.py
          python -m py_compile tools/test_original_hud_runtime.py
      - name: Exercise original Unity HUD with live-state-shaped test inputs
        run: python -u tools/test_original_hud_runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lios-original-source-hud-v9-integration-headless
          path: |
            last_island_recreated_game/assets/hud_original_xapk/complete_source_mapping/hud_v9_live_bridge_synthetic_test.png
            last_island_recreated_game/assets/hud_original_xapk/complete_source_mapping/hud_v9_live_bridge_synthetic_test.json
          if-no-files-found: warn
