name: Reverse engineer source Unity construction meshes and materials
on:
  workflow_dispatch:
  push:
    paths:
      - tools/audit_original_construction_meshes.py
      - .github/workflows/audit_original_construction_meshes.yml
permissions:
  contents: read
jobs:
  source-construction:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            xapk_original
            tools/audit_original_construction_meshes.py
          sparse-checkout-cone-mode: false
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -q UnityPy
          python -u tools/audit_original_construction_meshes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Original-Unity-Construction-Mesh-Sources
          path: original_construction_mesh_audit.json
          retention-days: 30
          if-no-files-found: warn
