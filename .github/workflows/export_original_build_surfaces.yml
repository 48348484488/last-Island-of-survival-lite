name: Extract original LITE 7.3 construction material textures
on:
  workflow_dispatch:
  push:
    paths:
      - tools/export_original_build_surfaces.py
      - .github/workflows/export_original_build_surfaces.yml
permissions:
  contents: read
jobs:
  export-build-surfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            xapk_original
            tools/export_original_build_surfaces.py
          filter: blob:none
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -q UnityPy
          python -u tools/export_original_build_surfaces.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Source-Unity-Original-Construction-Surface-Textures
          path: original_build_surfaces/
          if-no-files-found: warn
          retention-days: 30
