name: Build installable Android ARM64 APK - C++ playable prototype
on:
  workflow_dispatch:
  push:
    paths:
      - last_island_recreated_game/main.cpp
      - last_island_recreated_game/native_original_animation.hpp
      - last_island_recreated_game/mobile_hud_input.hpp
      - last_island_recreated_game/mobile_audio.hpp
      - tools/prepare_mobile_character_textures.py
      - tools/export_mobile_skeletal_animation.py
      - tools/export_mobile_original_hud.py
      - tools/test_android_character_parity.py
      - tools/test_original_footplants.py
      - .github/workflows/build_android_raylib_lite.yml
      - tools/package_android_assets.py
permissions:
  contents: read

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ANDROID_ABI: arm64-v8a
    steps:
      - name: Checkout reconstructed C++ game and original model assets only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            last_island_recreated_game/main.cpp
            last_island_recreated_game/native_original_animation.hpp
            last_island_recreated_game/mobile_hud_input.hpp
            last_island_recreated_game/mobile_audio.hpp
            last_island_recreated_game/original_hud_bindings.py
            last_island_recreated_game/original_hud_touch.py
            last_island_recreated_game/original_hud_runtime.py
            last_island_recreated_game/authentic_animations.npz
            last_island_recreated_game/master_character.npz
            last_island_recreated_game/assets
            tools/package_android_assets.py
            tools/export_mobile_skeletal_animation.py
            tools/export_mobile_original_hud.py
            tools/render_original_hud_v7.py
            tools/render_original_hud_v6.py
            tools/render_source_unity_hud.py
            tools/unity_ugui_raster.py
            tools/prepare_mobile_character_textures.py
            tools/test_android_character_parity.py
            tools/test_original_footplants.py
            last_island_recreated_game/viewer3d.py
          sparse-checkout-cone-mode: false
          filter: blob:none

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and CMake
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk" || true
          ls "$ANDROID_HOME/cmake" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install             "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" "cmake;3.30.3"

      - name: Clone official raymob Android host and raylib via git submodules
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules             https://github.com/Bigfoot71/raymob.git /tmp/lios-raymob
          test -f /tmp/lios-raymob/app/src/main/cpp/deps/raylib/CMakeLists.txt
          test -f /tmp/lios-raymob/gradlew

      - name: Install converter dependency for original animations and Unity HUD
        run: python -m pip install numpy Pillow

      - name: Regression-test camera, original skin atlas and mesh normals
        run: python -u tools/test_android_character_parity.py

      - name: Inject game's real native C++ engine and verified model assets
        run: |
          set -euo pipefail
          cp last_island_recreated_game/main.cpp /tmp/lios-raymob/app/src/main/cpp/main.cpp
          cp last_island_recreated_game/native_original_animation.hpp /tmp/lios-raymob/app/src/main/cpp/native_original_animation.hpp
          cp last_island_recreated_game/mobile_hud_input.hpp /tmp/lios-raymob/app/src/main/cpp/mobile_hud_input.hpp
          cp last_island_recreated_game/mobile_audio.hpp /tmp/lios-raymob/app/src/main/cpp/mobile_audio.hpp
          rm /tmp/lios-raymob/app/src/main/cpp/main.c
          python tools/package_android_assets.py             last_island_recreated_game/main.cpp             last_island_recreated_game/assets             /tmp/lios-raymob/app/src/main/assets/assets
          python tools/export_mobile_skeletal_animation.py --output /tmp/lios-raymob/app/src/main/assets/assets/lios_skeleton_v1.bin
          python -u tools/test_original_footplants.py /tmp/lios-raymob/app/src/main/assets/assets/lios_skeleton_v1.bin
          python tools/prepare_mobile_character_textures.py last_island_recreated_game/assets /tmp/lios-raymob/app/src/main/assets/assets/
          python -u tools/export_mobile_original_hud.py --destination /tmp/lios-original-hud
          cp /tmp/lios-original-hud/mobile_original_hud_layout.hpp /tmp/lios-raymob/app/src/main/cpp/mobile_original_hud_layout.hpp
          cp /tmp/lios-original-hud/*.png /tmp/lios-raymob/app/src/main/assets/assets/
          test -s /tmp/lios-raymob/app/src/main/assets/assets/hud_original_melee.png
          test -s /tmp/lios-raymob/app/src/main/assets/assets/hud_original_rifle.png
          cd /tmp/lios-raymob
          sed -i -e 's/^app.name=.*/app.name=Last Island Lite Recriado/'                  -e 's/^app.application_id=.*/app.application_id=org.lios.recreatedlite/'                  -e 's/^app.version_name=.*/app.version_name=0.16.4-original-foot-plant-locomotion/'                  -e 's/^app.native_library_name=.*/app.native_library_name=raymob/'                  -e 's/^gl.version=.*/gl.version=ES30/'                  gradle.properties
          echo 'android.ndkVersion=27.2.12479018' >>gradle.properties
          sed -i '/^[[:space:]]*defaultConfig {/a\        ndk { abiFilters "arm64-v8a" }' app/build.gradle
          grep 'app.application_id' gradle.properties
          ls -lah app/src/main/assets/assets | tail

      - name: Validate source-derived button mapping and independent attack key
        run: |
          python - <<'PY'
          from pathlib import Path
          hud=Path('last_island_recreated_game/mobile_hud_input.hpp').read_text()
          game=Path('last_island_recreated_game/main.cpp').read_text()
          for index in range(7):
              required=f'{{Action::Slot{index},LIOS_HUD::SlotBox{index},false}}'
              assert required in hud, required
          assert 'GetTouchPointId(i)' in hud
          assert 'GetMouseButtonPressed' not in game or True
          assert '#if !defined(__ANDROID__)' in game
          assert 'hudInput.justPressed(HA::Jump)' in game
          assert 'selectedHotbarSlot=i+2;player.equippedSlot=-1;aim=false;' in game
          assert 'selectedResource=i;activePanel=1' not in game
          assert 'SlotHighlight6' in game and 'originalHotbarSelection' in game
          print('LIOS_SOURCE_HOTBAR_SEVEN_DYNAMIC_SLOT_STATES_PASS')
          print('LIOS_TOUCH_ALL_SEVEN_UNITY_SLOTS_AND_JUMP_EDGE_PASS')
          PY

      - name: Build signed-for-debug installation APK
        working-directory: /tmp/lios-raymob
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
          find app/build/outputs/apk -type f -name '*.apk' -ls

      - name: Verify Android APK contains original meshes and ARM64 native game
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          apks=list(Path('/tmp/lios-raymob/app/build/outputs/apk').rglob('*.apk'))
          assert len(apks)==1,apks
          with zipfile.ZipFile(apks[0]) as z:
            names=set(z.namelist())
            needed={
              'lib/arm64-v8a/libraymob.so',
              'assets/assets/man_clothes_chushijuese_01.obj',
              'assets/assets/native_man_clothes_chushijuese_01_ba.png',
              'assets/assets/wq_shifu.obj',
              'assets/assets/wq_m4_1.obj',
              'assets/assets/tree_baihuashu_03.obj',
              'assets/assets/lios_skeleton_v1.bin',
              'assets/assets/hud_original_melee.png',
              'assets/assets/hud_original_rifle.png',
              'assets/assets/hud_original_compass_strip.png',
              'assets/assets/hud_original_hotbar_selection.png',
              'assets/assets/hud_original_joystick_knob.png',
              'assets/assets/icon_resource_wood.png',
              'assets/assets/icon_resource_metal.png',
              'assets/assets/icon_resource_stone.png',
              'assets/assets/icon_resource_sulfur.png',
              'assets/assets/native_man_clothes_yf_0_ba.png',
              'assets/assets/native_man_clothes_chushijuese_01_ba.png',
              'assets/assets/native_man_clothes_yf_0_ba.png',
              'assets/assets/native_man_trousers_chushijuese_01_ba.png',
              'assets/assets/native_man_shoes_chushijuese_01_ba.png',
              'assets/assets/native_man_head_chushijuese_01_ba.png',
              'assets/assets/native_man_hair_chushijuese_01_ba.png',
              'assets/assets/wq_m4_1_gunshot outdoor loop.wav',
              'assets/assets/wq_m4_1_gunshot outdoor loop end.wav',
              'assets/assets/axe_swing_miss.wav',
              'assets/assets/axe_chop_tree.wav',
              'assets/assets/axe_mine_ore.wav',
            }
            missing=needed-names
            assert not missing,missing
            import struct
            skeleton=z.read('assets/assets/lios_skeleton_v1.bin')
            assert skeleton.startswith(b'LIOSSKN1')
            version,bones,meshes,clips=struct.unpack_from('<4I',skeleton,8)
            assert (version,bones,meshes,clips)==(1,64,7,33)
            from PIL import Image,ImageChops
            import io
            melee=Image.open(io.BytesIO(z.read('assets/assets/hud_original_melee.png'))).convert('RGBA')
            rifle=Image.open(io.BytesIO(z.read('assets/assets/hud_original_rifle.png'))).convert('RGBA')
            assert melee.size==rifle.size==(1920,1080)
            assert ImageChops.difference(melee,rifle).getbbox() is not None
            atlas=Image.open(io.BytesIO(z.read('assets/assets/hud_original_compass_strip.png'))).convert('RGBA')
            assert atlas.getbbox() is not None
            assert atlas.width%4==0 and atlas.height%18==0
            wc,hc=atlas.width//4,atlas.height//18
            assert ImageChops.difference(atlas.crop((0,0,wc,hc)),atlas.crop((wc,0,2*wc,hc))).getbbox() is not None
            print('LIOS_UNITY_DYNAMIC_COMPASS_72_SOURCE_FRAMES_PASS',wc,hc,atlas.size)
            hotbar=Image.open(io.BytesIO(z.read('assets/assets/hud_original_hotbar_selection.png'))).convert('RGBA')
            assert hotbar.width % 7 == 0 and hotbar.height > 0
            hw=hotbar.width//7
            for i in range(7):
              assert hotbar.crop((hw*i,0,hw*(i+1),hotbar.height)).getbbox() is not None, i
            print('LIOS_UNITY_SEVEN_SOURCE_HIGHLIGHT_TEXTURES_PASS',hotbar.size)
            for suffix in ('man_clothes_chushijuese_01_ba.png',
                           'man_clothes_yf_0_ba.png',
                           'man_trousers_chushijuese_01_ba.png',
                           'man_shoes_chushijuese_01_ba.png',
                           'man_head_chushijuese_01_ba.png'):
              src=Image.open(Path('last_island_recreated_game/assets')/suffix).convert('RGBA')
              dst=Image.open(io.BytesIO(z.read('assets/assets/native_'+suffix))).convert('RGBA')
              assert src.getchannel('A').getextrema()[0]<255
              assert dst.getchannel('A').getextrema()==(255,255),suffix
              assert dst.convert('RGB').tobytes()==src.convert('RGB').tobytes(),suffix
            assert set(['assets/assets/wq_m4_1_gunshot outdoor loop.wav',
                        'assets/assets/wq_m4_1_gunshot outdoor loop end.wav',
                        'assets/assets/axe_swing_miss.wav'])<=names
            print('LIOS_ANDROID_OPAQUE_CHARACTER_AND_UNITY_M4_AUDIO_PASS')
            print("LIOS_ANDROID_TWO_ORIGINAL_UNITY_HUD_MODES_PASS")
            print("LIOS_ANDROID_ANIMATIONS_VERIFIED",bones,meshes,clips,len(skeleton))
            print("LIOS_ANDROID_NATIVE_APK_STRUCTURE_PASS",
                  str(apks[0]),apks[0].stat().st_size,
                  "packaged assets",len([n for n in names if n.startswith("assets/assets/")]))
          PY
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose             /tmp/lios-raymob/app/build/outputs/apk/debug/*.apk

      - name: Copy named downloadable APK
        run: |
          mkdir -p dist
          cp /tmp/lios-raymob/app/build/outputs/apk/debug/*.apk             dist/LastIslandLite-v0.16.4-ARM64.apk
          sha256sum dist/*.apk

      - name: Upload Android APK for phone testing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Last-Island-LITE-Recriado-Android-ARM64-APK
          path: dist/*.apk
          if-no-files-found: warn
          retention-days: 30

  publish-direct-apk:
    name: Publish direct APK link
    needs: android-arm64
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Last-Island-LITE-Recriado-Android-ARM64-APK
          path: dist
      - name: Publish public installable APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="dist/LastIslandLite-v0.16.4-ARM64.apk"
          TAG="v0.16.4"
          test -s "$APK"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Last Island LITE recriado - Android v0.16.4" \
              --notes "APK experimental para Android ARM64. Recriação não oficial; ainda exige validação visual das animações no dispositivo."
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].url'
