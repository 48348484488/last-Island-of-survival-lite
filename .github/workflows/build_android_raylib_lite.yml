name: Build installable Android ARM64 APK - C++ playable prototype
on:
  workflow_dispatch:
  push:
    paths:
      - last_island_recreated_game/main.cpp
      - last_island_recreated_game/native_original_animation.hpp
      - last_island_recreated_game/mobile_hud_input.hpp
      - last_island_recreated_game/mobile_audio.hpp
      - last_island_recreated_game/native_build_craft.hpp
      - last_island_recreated_game/mobile_build_visual.hpp
      - last_island_recreated_game/mobile_craft_ui.hpp
      - last_island_recreated_game/mobile_real_craft_catalog.hpp
      - last_island_recreated_game/mobile_original_craft_layout.hpp
      - last_island_recreated_game/mobile_original_terrain.hpp
      - last_island_recreated_game/assets/original_world/a-57_mesh0.obj
      - last_island_recreated_game/assets/original_world/a-57_tex0.png
      - tests/test_native_build_craft.cpp
      - tests/test_craft_source_geometry.py
      - tests/test_no_debug_grid.py
      - tests/test_android_frame_quality.py
      - tests/test_android_hud_vertical_alignment.py
      - tests/test_keyboard_modal_input.py
      - tests/test_original_terrain_runtime.py
      - tools/android_frame_quality.py
      - .github/scripts/android_virtual_smoke.sh
      - tools/prepare_mobile_character_textures.py
      - tools/export_mobile_skeletal_animation.py
      - tools/export_mobile_original_hud.py
      - tools/test_android_character_parity.py
      - tools/test_original_footplants.py
      - tools/export_original_stances.py
      - tools/restore_original_melee_run.py
      - .github/workflows/build_android_raylib_lite.yml
      - tools/package_android_assets.py
concurrency:
  group: lios-android-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
    env:
      ANDROID_ABI: arm64-v8a
    steps:
      - name: Checkout reconstructed C++ game and original model assets only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            last_island_recreated_game/main.cpp
            last_island_recreated_game/native_original_animation.hpp
            last_island_recreated_game/mobile_hud_input.hpp
            last_island_recreated_game/mobile_audio.hpp
            last_island_recreated_game/native_build_craft.hpp
            last_island_recreated_game/mobile_build_visual.hpp
            last_island_recreated_game/mobile_craft_ui.hpp
            last_island_recreated_game/mobile_real_craft_catalog.hpp
            last_island_recreated_game/mobile_original_terrain.hpp
            last_island_recreated_game/mobile_original_craft_layout.hpp
            tests/test_native_build_craft.cpp
            tests/test_craft_source_geometry.py
            tests/test_no_debug_grid.py
            tests/test_android_frame_quality.py
            tests/test_android_hud_vertical_alignment.py
            tests/test_keyboard_modal_input.py
            tests/test_original_terrain_runtime.py
            .github/scripts/android_virtual_smoke.sh
            .github/workflows/build_android_raylib_lite.yml
            tools/android_frame_quality.py
            last_island_recreated_game/original_hud_bindings.py
            last_island_recreated_game/original_hud_touch.py
            last_island_recreated_game/original_hud_runtime.py
            last_island_recreated_game/authentic_animations.npz
            raw_assets/assets/role/animationbundle.ab
            tools/export_original_stances.py
            tools/restore_original_melee_run.py
            last_island_recreated_game/master_character.npz
            last_island_recreated_game/assets
            tools/package_android_assets.py
            tools/export_mobile_skeletal_animation.py
            tools/export_mobile_original_hud.py
            tools/render_original_hud_v7.py
            tools/render_original_hud_v6.py
            tools/render_source_unity_hud.py
            tools/unity_ugui_raster.py
            tools/prepare_mobile_character_textures.py
            tools/test_android_character_parity.py
            tools/test_original_footplants.py
            last_island_recreated_game/viewer3d.py
          sparse-checkout-cone-mode: false
          filter: blob:none

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and CMake
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk" || true
          ls "$ANDROID_HOME/cmake" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install             "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" "cmake;3.30.3"

      - name: Clone official raymob Android host and raylib via git submodules
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules             https://github.com/Bigfoot71/raymob.git /tmp/lios-raymob
          test -f /tmp/lios-raymob/app/src/main/cpp/deps/raylib/CMakeLists.txt
          test -f /tmp/lios-raymob/gradlew

      - name: Install converter dependency for original animations and Unity HUD
        run: python -m pip install numpy Pillow UnityPy


      - name: Native crafting and base-building rule regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/test_native_build_craft.cpp -o /tmp/lios_build_test
          /tmp/lios_build_test
          python3 tests/test_craft_source_geometry.py
          python3 tests/test_no_debug_grid.py
          python3 tests/test_android_frame_quality.py
          python3 tests/test_android_hud_vertical_alignment.py
          python3 tests/test_keyboard_modal_input.py
           python3 tests/test_original_terrain_runtime.py

      # These five source-audited artifacts are pinned to immutable workflow
      # runs. Reuse their verified bytes across APK builds to avoid repeated
      # GitHub Actions artifact egress and intermittent HTTP 503 failures.
      - name: Restore pinned original Unity source artifact cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/lios-craft-original
            /tmp/lios-source-craft
            /tmp/lios-original-walls
            /tmp/lios-part-original
            /tmp/edgeai-original-build
          key: lios-source-40906450676-40910945599-40815593060-40815880408-40841337262-v2
          restore-keys: |
            lios-source-40910945599-40815593060-40815880408-40841337262-v1

      - name: Download source-traced Unity crafting sprites from audited XAPK extraction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lios-craft-original
          # The source run below was verified in the successful APK build
          # #41094777146. Do not switch to a moving 'latest successful' run.
          echo "LIOS_ORIGINAL_CRAFT_SOURCE_ARTIFACT_RUN=40906450676"
          if [[ ! -s /tmp/lios-craft-original/craft_source_manifest.json ]]; then
            for attempt in 1 2 3; do
              if gh run download 40906450676 --repo "$GITHUB_REPOSITORY" \
                --name Original-Unity-Craft-UI-Sprites --dir /tmp/lios-craft-original; then
                break
              fi
              if [[ "$attempt" -eq 3 ]]; then
                echo "PINNED_SOURCE_ARTIFACT_UNAVAILABLE craft_source_manifest.json" >&2
                exit 1
              fi
              sleep $((attempt * 15))
            done
          fi
          test -s /tmp/lios-craft-original/craft_source_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path("/tmp/lios-craft-original")
          data=json.loads((src/"craft_source_manifest.json").read_text())
          assert data["recovered"]>=70
          byid={str(v["pathid"]):v for v in data["images"]}
          expected={
              "craft_original_create_button.png":"-6604354997382583515",
              "craft_original_back_button.png":"-8671269052031048657",
              "craft_original_item_slot.png":"-175920981139765499",
              "craft_original_item_slot_small.png":"2730909933824249881",
              "craft_original_strip.png":"6108258474309846237",
              "craft_original_selected.png":"3490842252566290328",
              "craft_original_plus.png":"-8009850754480514078",
              "craft_original_minus.png":"1743642145107030626",
              "craft_original_close.png":"-1129542740885068637",
              "craft_original_secondary_tab.png":"-6746909455405468362"}
          target=Path("/tmp/lios-raymob/app/src/main/assets/assets")
          target.mkdir(parents=True,exist_ok=True)
          import shutil
          for name,identifier in expected.items():
              original=src/byid[identifier]["file"]
              shutil.copyfile(original,target/name)
              print("LIOS_ORIGINAL_CRAFT_PPTR_PACKAGED",identifier,name,flush=True)
          source_main=byid.get("8081054173552591411")
          selected_indicator=byid.get("-2981005624660488701")
          if selected_indicator:
              shutil.copyfile(src/selected_indicator["file"],
                              target/"craft_original_primary_tab_indicator.png")
              print("LIOS_ORIGINAL_PRIMARY_CRAFT_TAB_ACTIVE_INDICATOR_FOUND",flush=True)
          if source_main:
              shutil.copyfile(src/source_main["file"],
                              target/"craft_original_primary_tab.png")
              print("LIOS_ORIGINAL_PRIMARY_CRAFT_TAB_SOURCE_FOUND",flush=True)
          else:
              print("LIOS_ORIGINAL_PRIMARY_CRAFT_TAB_SOURCE_NOT_YET_RECOVERED",flush=True)
          PY

      - name: Integrate immutable source 519-recipe data with 512 real Unity Sprite icons
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lios-source-craft
          # Pinned to a previously successful source byte-audited action:
          # avoid silently consuming partially generated or guessed data.
          if [[ ! -s /tmp/lios-source-craft/native_craft_source_manifest.json ]]; then
            for attempt in 1 2 3; do
              if gh run download 40910945599 --repo "$GITHUB_REPOSITORY" \
            --name EdgeAI-Native-Original-Craft-Catalog-And-Atlases \
            --dir /tmp/lios-source-craft; then
                break
              fi
              if [[ "$attempt" -eq 3 ]]; then
                echo "PINNED_SOURCE_ARTIFACT_UNAVAILABLE native_craft_source_manifest.json" >&2
                exit 1
              fi
              sleep $((attempt * 15))
            done
          fi
          test -s /tmp/lios-source-craft/original_craft_catalog_v73.hpp
          test -s /tmp/lios-source-craft/native_craft_source_manifest.json
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          p=Path("/tmp/lios-source-craft")
          d=json.loads((p/"native_craft_source_manifest.json").read_text())
          assert d["original_records"]==519,d
          assert d["matched_unique_source_sprites"]==512,d
          assert d["atlas_count"]==4,d
          cpp=Path("/tmp/lios-raymob/app/src/main/cpp")
          assets=Path("/tmp/lios-raymob/app/src/main/assets/assets")
          assets.mkdir(parents=True,exist_ok=True)
          shutil.copy2(p/"original_craft_catalog_v73.hpp",cpp)
          for name in d["atlas_images"]:
              assert (p/name).stat().st_size>0,name
              shutil.copy2(p/name,assets/name)
          print("LIOS_ORIGINAL_519_SOURCE_RECIPES_AND_512_SPRITES_PACKAGED",d)
          PY

      - name: Package original Unity level-one building albedo textures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lios-original-walls
          if [[ ! -s /tmp/lios-original-walls/build_surface_manifest.json ]]; then
            for attempt in 1 2 3; do
              if gh run download 40815593060 --repo "$GITHUB_REPOSITORY" \
            --name Source-Unity-Original-Construction-Surface-Textures \
            --dir /tmp/lios-original-walls; then
                break
              fi
              if [[ "$attempt" -eq 3 ]]; then
                echo "PINNED_SOURCE_ARTIFACT_UNAVAILABLE build_surface_manifest.json" >&2
                exit 1
              fi
              sleep $((attempt * 15))
            done
          fi
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          folder=Path("/tmp/lios-original-walls")
          rows=json.loads((folder/"build_surface_manifest.json").read_text())
          expected={'foundation','wall','roof','doorway','window','stair'}
          assert {r['role'] for r in rows if r.get('file')}==expected
          target=Path("/tmp/lios-raymob/app/src/main/assets/assets")
          target.mkdir(parents=True,exist_ok=True)
          for r in rows:
            source=folder/r["file"]
            assert source.is_file() and source.stat().st_size>2000
            assert "partinfo_material" in r["source_bundle"]
            assert r["source_texture_id"] and r["sha256"]
            shutil.copy2(source,target/r["file"])
            # Unity _d texture alpha is a material mask in window/door;
            # raylib uses it as regular transparency. Keep original 1:1
            # RGBA and make opaque RGB-identical copies only for rendering.
            if r["role"] in ("doorway","window"):
              from PIL import Image
              original=Image.open(source).convert("RGBA")
              if original.getchannel("A").getextrema()[1]>=100:
                raise AssertionError("Alpha was not a Unity mask")
              render=original.copy()
              render.putalpha(255)
              render.save(target/("build_native_opaque_"+r["role"]+".png"))
              assert render.convert("RGB").tobytes()==original.convert("RGB").tobytes()
            print("LIOS_UNITY_ORIGINAL_BUILD_SURFACE_PACKAGED",
                  r["role"],r["source_texture_name"],r["source_texture_id"],flush=True)
          PY

      - name: Package original source Unity build-part item icon sprites
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lios-part-original
          if [[ ! -s /tmp/lios-part-original/part_icons_manifest.json ]]; then
            for attempt in 1 2 3; do
              if gh run download 40815880408 --repo "$GITHUB_REPOSITORY" \
            --name Original-LITE-Player-Building-Part-Icons \
            --dir /tmp/lios-part-original; then
                break
              fi
              if [[ "$attempt" -eq 3 ]]; then
                echo "PINNED_SOURCE_ARTIFACT_UNAVAILABLE part_icons_manifest.json" >&2
                exit 1
              fi
              sleep $((attempt * 15))
            done
          fi
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          folder=Path('/tmp/lios-part-original')
          data=json.loads((folder/'part_icons_manifest.json').read_text(encoding='utf8'))
          items={x['name']:x for bundle in data for x in bundle['icons']
                 if x.get('file')}
          known={
            'foundation':'dj_sj_1',
            'wall':'qb_qb_1',
            'doorway':'qb_mk_1',
            'roof':'wd_sj_1',
            'stair':'dj_tj_1',
            'window':'tb_waiqiangjia_chuanghu_01',
            'obstacle':'buildpartpf10_muzhizhalan',
          }
          output=Path('/tmp/lios-raymob/app/src/main/assets/assets')
          output.mkdir(parents=True,exist_ok=True)
          for kind,name in known.items():
            assert name in items, (kind,name)
            icon=items[name]
            origin=folder/icon['file']
            assert origin.is_file() and origin.stat().st_size>100
            dest=output/('build_icon_'+kind+'.png')
            shutil.copy2(origin,dest)
            print('LIOS_ORIGINAL_UNITY_PART_SPRITE',kind,name,icon['id'],flush=True)
          PY

      - name: Integrate EdgeAI source-exact 35 original Unity BuildPart sprites and metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/edgeai-original-build
          if [[ ! -s /tmp/edgeai-original-build/edgeai_real_buildpart_decoded.json ]]; then
            for attempt in 1 2 3; do
              if gh run download 40841337262 --repo "$GITHUB_REPOSITORY" \
            --name EdgeAI-Original-Unity-BuildPart-Level1-Exact-Config \
            --dir /tmp/edgeai-original-build; then
                break
              fi
              if [[ "$attempt" -eq 3 ]]; then
                echo "PINNED_SOURCE_ARTIFACT_UNAVAILABLE edgeai_real_buildpart_decoded.json" >&2
                exit 1
              fi
              sleep $((attempt * 15))
            done
          fi
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          base=Path("/tmp/edgeai-original-build")
          report=json.loads((base/"edgeai_real_buildpart_decoded.json").read_text())
          assert report["record_count"]==638,report["record_count"]
          expected={2:4,3:9,4:3,6:8,7:3,8:8}
          for group in report["groups"].values():
              if group["type_id"] in expected:
                  assert group["count"]==expected[group["type_id"]],group
          src=base/"edgeai_native_build_widgets"
          target=Path("/tmp/lios-raymob/app/src/main/assets/assets")
          target.mkdir(parents=True,exist_ok=True)
          for t,n in expected.items():
              name=f"hud_original_build_items_type_{t}.png"
              path=src/name
              assert path.stat().st_size>2000,name
              shutil.copy2(path,target/name)
              print("LIOS_EDGEAI_SOURCE_EXACT_BUILD_ICONS",t,n,name,flush=True)
          cpp=src/"original_buildpart_v7.hpp"
          assert cpp.stat().st_size>2000
          shutil.copy2(cpp,Path("/tmp/lios-raymob/app/src/main/cpp")/cpp.name)
          print("LIOS_EDGEAI_35_ORIGINAL_BUILDPART_SOURCE_IDENTITIES_READY",flush=True)
          PY

      - name: Regression-test camera, original skin atlas and mesh normals
        run: python -u tools/test_android_character_parity.py

      - name: Inject game's real native C++ engine and verified model assets
        run: |
          set -euo pipefail
          cp last_island_recreated_game/main.cpp /tmp/lios-raymob/app/src/main/cpp/main.cpp
          cp last_island_recreated_game/native_original_animation.hpp /tmp/lios-raymob/app/src/main/cpp/native_original_animation.hpp
          cp last_island_recreated_game/mobile_hud_input.hpp /tmp/lios-raymob/app/src/main/cpp/mobile_hud_input.hpp
          cp last_island_recreated_game/mobile_audio.hpp /tmp/lios-raymob/app/src/main/cpp/mobile_audio.hpp
          cp last_island_recreated_game/native_build_craft.hpp /tmp/lios-raymob/app/src/main/cpp/native_build_craft.hpp
          cp last_island_recreated_game/mobile_build_visual.hpp /tmp/lios-raymob/app/src/main/cpp/mobile_build_visual.hpp
          cp last_island_recreated_game/mobile_craft_ui.hpp /tmp/lios-raymob/app/src/main/cpp/mobile_craft_ui.hpp
          cp last_island_recreated_game/mobile_real_craft_catalog.hpp /tmp/lios-raymob/app/src/main/cpp/mobile_real_craft_catalog.hpp
           cp last_island_recreated_game/mobile_original_terrain.hpp /tmp/lios-raymob/app/src/main/cpp/mobile_original_terrain.hpp
          cp last_island_recreated_game/mobile_original_craft_layout.hpp /tmp/lios-raymob/app/src/main/cpp/mobile_original_craft_layout.hpp
          rm /tmp/lios-raymob/app/src/main/cpp/main.c
          python tools/package_android_assets.py             last_island_recreated_game/main.cpp             last_island_recreated_game/assets             /tmp/lios-raymob/app/src/main/assets/assets
          python -u tools/export_original_stances.py --report /tmp/lios_original_stances_report.json
          python tools/export_mobile_skeletal_animation.py --output /tmp/lios-raymob/app/src/main/assets/assets/lios_skeleton_v1.bin
          python -u tools/test_original_footplants.py /tmp/lios-raymob/app/src/main/assets/assets/lios_skeleton_v1.bin
          python tools/prepare_mobile_character_textures.py last_island_recreated_game/assets /tmp/lios-raymob/app/src/main/assets/assets/
          python -u tools/export_mobile_original_hud.py --destination /tmp/lios-original-hud
          cp /tmp/lios-original-hud/mobile_original_hud_layout.hpp /tmp/lios-raymob/app/src/main/cpp/mobile_original_hud_layout.hpp
          cp /tmp/lios-original-hud/*.png /tmp/lios-raymob/app/src/main/assets/assets/
          test -s /tmp/lios-raymob/app/src/main/assets/assets/hud_original_melee.png
          test -s /tmp/lios-raymob/app/src/main/assets/assets/hud_original_rifle.png
          test -s /tmp/lios-raymob/app/src/main/assets/assets/hud_original_build.png
          test -s /tmp/lios-raymob/app/src/main/assets/assets/hud_original_build_categories.png
          test -s /tmp/lios-raymob/app/src/main/assets/assets/hud_original_build_selected.png
          test -s /tmp/lios-raymob/app/src/main/assets/assets/hud_original_build_rotate.png
          test -s /tmp/lios-raymob/app/src/main/assets/assets/hud_original_build_children.png
          test -s /tmp/lios-raymob/app/src/main/cpp/original_buildpart_v7.hpp
          for t in 2 3 4 6 7 8; do
            test -s "/tmp/lios-raymob/app/src/main/assets/assets/hud_original_build_items_type_${t}.png"
          done
          for kind in foundation wall doorway roof stair window obstacle; do
            test -s "/tmp/lios-raymob/app/src/main/assets/assets/build_icon_${kind}.png"
          done
          grep -q 'BuildChildCount' /tmp/lios-raymob/app/src/main/cpp/mobile_original_hud_layout.hpp
          grep -q 'Build_btn_changeButton' /tmp/lios-raymob/app/src/main/cpp/mobile_original_hud_layout.hpp
          test -s /tmp/lios-raymob/app/src/main/assets/assets/craft_original_create_button.png
          test -s /tmp/lios-raymob/app/src/main/assets/assets/craft_original_item_slot.png
          test -s /tmp/lios-raymob/app/src/main/cpp/original_craft_catalog_v73.hpp
          for a in 0 1 2 3; do
            test -s "/tmp/lios-raymob/app/src/main/assets/assets/craft_source_atlas_${a}.png"
          done
          test -s /tmp/lios-raymob/app/src/main/assets/assets/icon_source_construction_hammer.png
          test -s /tmp/lios-raymob/app/src/main/assets/assets/icon_source_stone_pickaxe.png
          for kind in foundation wall roof window doorway stair; do
            test -s "/tmp/lios-raymob/app/src/main/assets/assets/build_original_${kind}.png"
          done
          test -s /tmp/lios-raymob/app/src/main/assets/assets/build_native_opaque_window.png
          test -s /tmp/lios-raymob/app/src/main/assets/assets/build_native_opaque_doorway.png
          grep -q 'Build_btn_build' /tmp/lios-raymob/app/src/main/cpp/mobile_original_hud_layout.hpp
          grep -q 'Build_btn_fundation' /tmp/lios-raymob/app/src/main/cpp/mobile_original_hud_layout.hpp
          cd /tmp/lios-raymob
          sed -i -e 's/^app.name=.*/app.name=Last Island Lite Recriado/'                  -e 's/^app.application_id=.*/app.application_id=org.lios.recreatedlite/'                  -e 's/^app.version_name=.*/app.version_name=0.25.0-source-519-craft-catalog/'                  -e 's/^app.native_library_name=.*/app.native_library_name=raymob/'                  -e 's/^gl.version=.*/gl.version=ES30/'                  gradle.properties
          echo 'android.ndkVersion=27.2.12479018' >>gradle.properties
          sed -i '/^[[:space:]]*defaultConfig {/a\        ndk { abiFilters "arm64-v8a" }' app/build.gradle
          grep 'app.application_id' gradle.properties
          ls -lah app/src/main/assets/assets | tail

      - name: Validate source-derived button mapping and independent attack key
        run: |
          python - <<'PY'
          from pathlib import Path
          hud=Path('last_island_recreated_game/mobile_hud_input.hpp').read_text()
          game=Path('last_island_recreated_game/main.cpp').read_text()
          for index in range(7):
              required=f'{{Action::Slot{index},LIOS_HUD::SlotBox{index},false}}'
              assert required in hud, required
          assert 'GetTouchPointId(i)' in hud
          assert 'GetMouseButtonPressed' not in game or True
