  publish-direct-apk:
    name: Publish direct APK link
    needs: android-arm64
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Last-Island-LITE-Recriado-Android-ARM64-APK
          path: dist
      - name: Publish public installable APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="dist/LastIslandLite-v0.25.0-${GITHUB_SHA:0:8}-ARM64.apk"
          TAG="v0.25.0-${GITHUB_SHA:0:8}"
          test -s "$APK"
          # GitHub Releases can intermittently return HTTP 500 after the APK
          # has already compiled and passed the emulator smoke. Retry only
          # publishing; never rebuild or claim an APK was published prematurely.
          published=0
          for attempt in 1 2 3 4; do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              if gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber; then
                published=1
                break
              fi
            else
              if gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "Last Island LITE recriado - Android craft V25 commit ${GITHUB_SHA:0:8}" \
                --notes "APK ARM64 experimental V25: catalogo de 519 receitas e 512 sprites originais do XAPK, mais filtros e listagem. Producao offline parcial de itens basicos, sem servidor nem provas de paridade visual UGUI completa; antigo sistema demonstrativo acessivel como teste separado."; then
                published=1
                break
              fi
            fi
            echo "LIOS_RELEASE_PUBLISH_RETRY attempt=$attempt" >&2
            if [[ "$attempt" -lt 4 ]]; then sleep $((attempt * 15)); fi
          done
          if [[ "$published" -ne 1 ]]; then
            echo "LIOS_RELEASE_PUBLISH_FAILED_AFTER_RETRIES" >&2
            exit 1
          fi
          for attempt in 1 2 3; do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].url'; then
              exit 0
            fi
            echo "LIOS_RELEASE_VERIFY_RETRY attempt=$attempt" >&2
            sleep $((attempt * 10))
          done
          echo "LIOS_RELEASE_VERIFY_FAILED" >&2
          exit 1

  android-virtual-smoke:
    name: Attempt actual Android virtual ARM64 runtime
    needs: android-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout standalone emulator smoke script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/android_virtual_smoke.sh
            tools/android_frame_quality.py
          sparse-checkout-cone-mode: false
          filter: blob:none

      - uses: actions/download-artifact@v4
        with:
          name: Last-Island-LITE-Recriado-Android-ARM64-APK
          path: dist

      - name: Check compiled APK exists
        run: |
          mkdir -p evidence
          find dist -name '*.apk' -type f -print
          test "$(find dist -name '*.apk' -type f | wc -l)" -eq 1
          sha256sum dist/*.apk > evidence/apk-sha256.txt

      - name: Install screenshot verification dependency
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Enable KVM hardware acceleration on GitHub Linux runner
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
            ls -l /dev/kvm
          else
            echo "KVM_UNAVAILABLE: emulator will use slow software emulation"
          fi

      - name: Install and launch in Android virtual environment
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          disk-size: 3G
          emulator-options: -no-window -no-snapshot-save -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          # The runner's automatic 'adb shell settings put ...' failed with
          # Broken pipe (32) after a slow first boot, before our smoke script ran.
          # Skip that optional ADB settings operation; runtime checks are in
          # the checked-in script and still require a live game PID.
          disable-animations: false
          # The script also waits for a live Android package service before
          # installing, so a partially booted guest cannot masquerade as a
          # game installation failure.
          script: bash .github/scripts/android_virtual_smoke.sh

      - name: Preserve virtual execution diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Last-Island-Android-Virtual-Runtime-Evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
