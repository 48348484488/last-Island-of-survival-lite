name: EdgeAI find original BuildPart.oc configuration in source XAPK
on:
  workflow_dispatch:
  push:
    paths:
      - tools/find_buildpart_original_table.py
      - .github/workflows/find-original-buildpart-table.yml
permissions:
  contents: read
jobs:
  locate-original-unity-config:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            xapk_original
            tools/find_buildpart_original_table.py
          filter: blob:none
          sparse-checkout-cone-mode: false
      - run: python3 -u tools/find_buildpart_original_table.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EdgeAI-BuildPart-OC-Source-Locator
          path: original_buildpart_cfg_locator.json
          retention-days: 30
          if-no-files-found: warn
