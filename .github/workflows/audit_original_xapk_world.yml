name: Audit original LITE 7.3 world assets
on:
  workflow_dispatch:
  push:
    paths:
      - tools/audit_original_xapk_world.py
      - .github/workflows/audit_original_xapk_world.yml
permissions:
  contents: read
jobs:
  audit-world:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/audit_original_xapk_world.py
            xapk_original
          filter: blob:none
          sparse-checkout-cone-mode: false
      - name: Inventory source original XAPK and install-time asset pack
        run: python -u tools/audit_original_xapk_world.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LITE-7.3-Original-World-Source-Index
          path: original_world_xapk_audit.json
          retention-days: 30
          if-no-files-found: warn
