name: Oxide UnityFS player and camera field inventory

on:
  push:
    branches: [main]
    paths:
      - "tools/audit_unityfs.py"
      - "tests/test_unityfs.py"
      - ".github/workflows/unityfs-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan updated UnityFS bundles for player and camera fields
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools
            tests
      - name: Install UnityFS LZ4 decompressor
        run: python3 -m pip install --user "lz4==4.4.4"
      - name: Verify scanner with independent fixtures
        run: python3 -m unittest discover -s tests -p "test_unityfs.py" -v
      - name: Download unmodified game Unity data from Release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 1800 --silent --show-error \
            -o split_UnityDataAssetPack.apk \
            "https://github.com/48348484488/oxide/releases/download/v1.0.0/split_UnityDataAssetPack.apk"
          echo "2f0f7f1be7d78d269f710edd471c40a9755a93a07481cae0c058356515e19834  split_UnityDataAssetPack.apk" | sha256sum --check
      - name: Decode and inspect UnityFS bundles
        run: python3 tools/audit_unityfs.py --assetpack split_UnityDataAssetPack.apk --out unityfs-output/unityfs.json
      - name: Summarize findings
        if: always()
        shell: bash
        run: |
          if [ -f unityfs-output/unityfs.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open("unityfs-output/unityfs.json"))
          print("# Updated Oxide UnityFS string-field scan")
          print("Bundles: {}/{}; errors: {}; skipped: {}".format(d["scanned"],d["bundle_count"],len(d["errors"]),len(d["skipped"])))
          for k,v in sorted(d["occurrences"].items()):
              print("- {}: {}".format(k,v))
          print("These are serialized substring matches, not proof of runtime fields or player position data.")
          PY
          else
            echo "Scanner failed before writing report." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve only analysis JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oxide-1-14-unityfs-field-inventory
          path: unityfs-output/
          retention-days: 14
          if-no-files-found: warn
