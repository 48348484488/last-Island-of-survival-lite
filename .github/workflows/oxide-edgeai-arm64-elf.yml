name: Oxide ARM64 original binary static scan with EdgeAI parser

on:
  push:
    branches: [main]
    paths:
      - "tools/edgeai_elf_inspect.py"
      - "tools/edgeai_inspect_arm64_split.py"
      - "tools/edgeai_arm64_branch_map.py"
      - "tests/test_edgeai_arm64_split.py"
      - "tests/test_edgeai_arm64_branch_map.py"
      - ".github/workflows/oxide-edgeai-arm64-elf.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edgeai-elf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/edgeai_elf_inspect.py
            tools/edgeai_inspect_arm64_split.py
            tools/edgeai_arm64_branch_map.py
            tests/test_edgeai_arm64_split.py
            tests/test_edgeai_arm64_branch_map.py
            split_config.arm64_v8a.apk
          sparse-checkout-cone-mode: false
      - name: Install LLVM for real AArch64 shared object test fixture
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld llvm
      - name: Regression test on compiler-produced ARM64 ELF, fail on corrupt headers
        run: |
          python3 -m unittest discover -s tests -p test_edgeai_arm64_split.py -v
          python3 -m unittest discover -s tests -p test_edgeai_arm64_branch_map.py -v
      - name: Audit unmodified 80MB APK and 236MB IL2CPP library read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p edgeai-static-evidence
          echo '504c7e3ba1bff9fdc7e8a3f963f1a3eccb4b1bf93b093dc855c627d832dc931a  split_config.arm64_v8a.apk' | sha256sum -c -
          python3 tools/edgeai_inspect_arm64_split.py split_config.arm64_v8a.apk \
            --output edgeai-static-evidence/oxide_elf64_inventory.json \
            | tee edgeai-static-evidence/oxide_elf64_summary.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("edgeai-static-evidence/oxide_elf64_inventory.json").read_text())
          assert data["status"]=="ARM64_APK_STATIC_INVENTORY_PASS",data
          libs={x["file"]:x for x in data["libraries"]}
          assert set(libs)=={"libil2cpp.so","libunity.so","libloader.so"},data
          assert libs["libil2cpp.so"]["bytes"]==236123768,data
          assert all(lib["architecture"]=="AArch64" for lib in libs.values())
          assert not data["game_executed"] and not data["runtime_player_coordinates_verified"]
          print("EDGEAI_ELF64_REAL_OXIDE_LIBRARY_AUDIT_PASS")
          PY
      - name: Map AArch64 direct branches within real loader JNI_OnLoad
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/edgeai_arm64_branch_map.py split_config.arm64_v8a.apk             --library libloader.so --function JNI_OnLoad             --output edgeai-static-evidence/loader-jni-arm64-control-transfers.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('edgeai-static-evidence/loader-jni-arm64-control-transfers.json')
          d=json.loads(p.read_text())
          assert d["function"]=="JNI_OnLoad" and d["architecture"]=="AArch64",d
          assert d["entry"]=="0x4e91f4" and d["size_bytes"]==4524,d
          assert d["decoded_control_transfers"]>0,d
          assert not d["code_executed"]
          print("EDGEAI_NATIVE_ARM64_LOADER_CONTROL_TRANSFER_MAP_PASS")
          PY
      - name: Cross-check EdgeAI native AArch64 branch candidates against LLVM disassembly
        shell: bash
        run: |
          set -euo pipefail
          tempdir="$(mktemp -d)"
          trap 'rm -rf "$tempdir"' EXIT
          unzip -p split_config.arm64_v8a.apk lib/arm64-v8a/libloader.so > "$tempdir/libloader.so"
          read -r start end < <(python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('edgeai-static-evidence/loader-jni-arm64-control-transfers.json').read_text())
          start=int(d['entry'],16)
          print(hex(start),hex(start+d['size_bytes']))
          PY
          )
          llvm-objdump -d --no-show-raw-insn --start-address="$start" --stop-address="$end" "$tempdir/libloader.so" \
            > edgeai-static-evidence/loader-jni-llvm-disasm.txt
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          d=json.loads(Path('edgeai-static-evidence/loader-jni-arm64-control-transfers.json').read_text())
          text=Path('edgeai-static-evidence/loader-jni-llvm-disasm.txt').read_text()
          table={'b':'B','bl':'BL','br':'BR','blr':'BLR','ret':'RET',
                 'cbz':'CBZ','cbnz':'CBNZ','tbz':'TBZ','tbnz':'TBNZ'}
          entries={}
          for line in text.splitlines():
              m=re.match(r'^\s*([0-9a-fA-F]+):\s+([a-zA-Z][a-zA-Z0-9.]*)\b',line)
              if not m: continue
              op=m[2].lower()
              kind=table.get(op,'B.cond' if op.startswith('b.') and op!='b.al' else None)
              if kind:
                  entries[int(m[1],16)]=kind
          ours={int(x['pc'],16):x['kind'] for x in d['control_transfer_candidates']}
          matched={pc for pc,k in ours.items() if entries.get(pc)==k}
          scanner_only={hex(pc):k for pc,k in ours.items() if entries.get(pc)!=k}
          llvm_only={hex(pc):k for pc,k in entries.items() if ours.get(pc)!=k}
          report={'scanner_candidates':len(ours),'llvm_decoded_control_transfers':len(entries),
                  'agreed_address_and_opcode':len(matched),
                  'scanner_only':scanner_only,'llvm_only':llvm_only,
                  'source':'LLVM llvm-objdump on original unmodified ELF; static only',
                  'code_executed':False}
          Path('edgeai-static-evidence/loader-jni-llvm-comparison.json').write_text(
              json.dumps(report,indent=2)+'\n')
          print(json.dumps({k:v for k,v in report.items() if k not in ('scanner_only','llvm_only')},indent=2))
          assert 20 <= len(entries) <= d['size_bytes']//4,report
          assert len(matched)==len(ours) and not llvm_only,report
          PY
      - name: Upload audit logs, no game executables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oxide-edgeai-elf64-static-audit
          path: edgeai-static-evidence/*
          if-no-files-found: warn
          retention-days: 14
