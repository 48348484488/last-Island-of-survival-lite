name: Oxide ARM64 original binary static scan with EdgeAI parser

on:
  push:
    branches: [main]
    paths:
      - "tools/edgeai_elf_inspect.py"
      - "tools/edgeai_inspect_arm64_split.py"
      - "tools/edgeai_arm64_branch_map.py"
      - "tools/edgeai_arm64_cfg.py"
      - "tools/edgeai_arm64_indirect_audit.py"
      - "tools/edgeai_arm64_dispatch_bounds.py"
      - "tools/edgeai_arm64_table_entries.py"
      - "tools/edgeai_arm64_unity_exports.py"
      - "tools/edgeai_arm64_llvm_crosscheck.py"
      - "tools/edgeai_arm64_symbol_triage.py"
      - "tests/test_edgeai_arm64_split.py"
      - "tests/test_edgeai_arm64_branch_map.py"
      - "tests/test_edgeai_arm64_cfg.py"
      - "tests/test_edgeai_arm64_indirect_audit.py"
      - "tests/test_edgeai_arm64_dispatch_bounds.py"
      - "tests/test_edgeai_arm64_table_entries.py"
      - "tests/test_edgeai_arm64_unity_exports.py"
      - "tests/test_edgeai_arm64_llvm_crosscheck.py"
      - "tests/test_edgeai_arm64_symbol_triage.py"
      - ".github/workflows/oxide-edgeai-arm64-elf.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edgeai-elf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/edgeai_elf_inspect.py
            tools/edgeai_inspect_arm64_split.py
            tools/edgeai_arm64_branch_map.py
            tools/edgeai_arm64_cfg.py
            tools/edgeai_arm64_indirect_audit.py
            tools/edgeai_arm64_dispatch_bounds.py
            tools/edgeai_arm64_table_entries.py
            tools/edgeai_arm64_unity_exports.py
            tools/edgeai_arm64_llvm_crosscheck.py
            tools/edgeai_arm64_symbol_triage.py
            tests/test_edgeai_arm64_split.py
            tests/test_edgeai_arm64_branch_map.py
            tests/test_edgeai_arm64_cfg.py
            tests/test_edgeai_arm64_indirect_audit.py
            tests/test_edgeai_arm64_dispatch_bounds.py
            tests/test_edgeai_arm64_table_entries.py
            tests/test_edgeai_arm64_unity_exports.py
            tests/test_edgeai_arm64_llvm_crosscheck.py
            tests/test_edgeai_arm64_symbol_triage.py
            split_config.arm64_v8a.apk
          sparse-checkout-cone-mode: false
      - name: Install LLVM for real AArch64 shared object test fixture
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld llvm
      - name: Regression test on compiler-produced ARM64 ELF, fail on corrupt headers
        run: |
          python3 -m unittest discover -s tests -p test_edgeai_arm64_split.py -v
          python3 -m unittest discover -s tests -p test_edgeai_arm64_branch_map.py -v
          python3 -m unittest discover -s tests -p test_edgeai_arm64_cfg.py -v
          python3 -m unittest discover -s tests -p test_edgeai_arm64_indirect_audit.py -v
          python3 -m unittest discover -s tests -p test_edgeai_arm64_dispatch_bounds.py -v
          python3 -m unittest discover -s tests -p test_edgeai_arm64_table_entries.py -v
          python3 -m unittest discover -s tests -p test_edgeai_arm64_unity_exports.py -v
          python3 -m unittest discover -s tests -p test_edgeai_arm64_llvm_crosscheck.py -v
          python3 -m unittest discover -s tests -p test_edgeai_arm64_symbol_triage.py -v
      - name: Audit unmodified 80MB APK and 236MB IL2CPP library read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p edgeai-static-evidence
          echo '504c7e3ba1bff9fdc7e8a3f963f1a3eccb4b1bf93b093dc855c627d832dc931a  split_config.arm64_v8a.apk' | sha256sum -c -
          python3 tools/edgeai_inspect_arm64_split.py split_config.arm64_v8a.apk \
            --output edgeai-static-evidence/oxide_elf64_inventory.json \
            | tee edgeai-static-evidence/oxide_elf64_summary.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("edgeai-static-evidence/oxide_elf64_inventory.json").read_text())
          assert data["status"]=="ARM64_APK_STATIC_INVENTORY_PASS",data
          libs={x["file"]:x for x in data["libraries"]}
          assert set(libs)=={"libil2cpp.so","libunity.so","libloader.so"},data
          assert libs["libil2cpp.so"]["bytes"]==236123768,data
          assert all(lib["architecture"]=="AArch64" for lib in libs.values())
          assert not data["game_executed"] and not data["runtime_player_coordinates_verified"]
          print("EDGEAI_ELF64_REAL_OXIDE_LIBRARY_AUDIT_PASS")
          PY
      - name: Map AArch64 direct branches within real loader JNI_OnLoad
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/edgeai_arm64_branch_map.py split_config.arm64_v8a.apk             --library libloader.so --function JNI_OnLoad             --output edgeai-static-evidence/loader-jni-arm64-control-transfers.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('edgeai-static-evidence/loader-jni-arm64-control-transfers.json')
          d=json.loads(p.read_text())
          assert d["function"]=="JNI_OnLoad" and d["architecture"]=="AArch64",d
          assert d["entry"]=="0x4e91f4" and d["size_bytes"]==4524,d
          assert d["decoded_control_transfers"]>0,d
          assert not d["code_executed"]
          print("EDGEAI_NATIVE_ARM64_LOADER_CONTROL_TRANSFER_MAP_PASS")
          PY
      - name: Cross-check EdgeAI native AArch64 branch candidates against LLVM disassembly
        shell: bash
        run: |
          set -euo pipefail
          tempdir="$(mktemp -d)"
          trap 'rm -rf "$tempdir"' EXIT
          unzip -p split_config.arm64_v8a.apk lib/arm64-v8a/libloader.so > "$tempdir/libloader.so"
          read -r start end < <(python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('edgeai-static-evidence/loader-jni-arm64-control-transfers.json').read_text())
          start=int(d['entry'],16)
          print(hex(start),hex(start+d['size_bytes']))
          PY
          )
          llvm-objdump -d --no-show-raw-insn --start-address="$start" --stop-address="$end" "$tempdir/libloader.so" \
            > edgeai-static-evidence/loader-jni-llvm-disasm.txt
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          d=json.loads(Path('edgeai-static-evidence/loader-jni-arm64-control-transfers.json').read_text())
          text=Path('edgeai-static-evidence/loader-jni-llvm-disasm.txt').read_text()
          table={'b':'B','bl':'BL','br':'BR','blr':'BLR','ret':'RET',
                 'cbz':'CBZ','cbnz':'CBNZ','tbz':'TBZ','tbnz':'TBNZ'}
          entries={}
          for line in text.splitlines():
              m=re.match(r'^\s*([0-9a-fA-F]+):\s+([a-zA-Z][a-zA-Z0-9.]*)\b',line)
              if not m: continue
              op=m[2].lower()
              kind=table.get(op,'B.cond' if op.startswith('b.') and op!='b.al' else None)
              if kind:
                  entries[int(m[1],16)]=kind
          ours={int(x['pc'],16):x['kind'] for x in d['control_transfer_candidates']}
          matched={pc for pc,k in ours.items() if entries.get(pc)==k}
          scanner_only={hex(pc):k for pc,k in ours.items() if entries.get(pc)!=k}
          llvm_only={hex(pc):k for pc,k in entries.items() if ours.get(pc)!=k}
          report={'scanner_candidates':len(ours),'llvm_decoded_control_transfers':len(entries),
                  'agreed_address_and_opcode':len(matched),
                  'scanner_only':scanner_only,'llvm_only':llvm_only,
                  'source':'LLVM llvm-objdump on original unmodified ELF; static only',
                  'code_executed':False}
          Path('edgeai-static-evidence/loader-jni-llvm-comparison.json').write_text(
              json.dumps(report,indent=2)+'\n')
          print(json.dumps({k:v for k,v in report.items() if k not in ('scanner_only','llvm_only')},indent=2))
          assert 20 <= len(entries) <= d['size_bytes']//4,report
          assert len(matched)==len(ours) and not llvm_only,report
          PY
      - name: Verify bounded EdgeAI candidate basic-block CFG on original Oxide JNI_OnLoad
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/edgeai_arm64_cfg.py split_config.arm64_v8a.apk \
            --library libloader.so --function JNI_OnLoad \
            --output edgeai-static-evidence/loader-jni-arm64-candidate-cfg.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path("edgeai-static-evidence/loader-jni-arm64-candidate-cfg.json").read_text())
          controls=json.loads(Path("edgeai-static-evidence/loader-jni-arm64-control-transfers.json").read_text())
          assert graph["architecture"]=="AArch64"
          assert graph["function"]=="JNI_OnLoad"
          assert graph["entry"]==controls["entry"]
          assert graph["symbol_size_bytes"]==controls["size_bytes"]==4524
          assert graph["block_count"]>10
          assert graph["edge_kind_counts"].get("direct_call_site",0)==9
          assert not graph["code_executed"] and not graph["reachability_proven"]
          assert not graph["loop_iteration_count_proven"]
          assert all(x["evidence"]=="decoded_static_candidate" for x in graph["edges"])
          print("EDGEAI_ARM64_CANDIDATE_CFG_ORIGINAL_LOADER_PASS")
          PY
      - name: Classify loader unresolved indirect dispatch patterns without guessing targets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/edgeai_arm64_indirect_audit.py \
            edgeai-static-evidence/loader-jni-arm64-control-transfers.json \
            edgeai-static-evidence/loader-jni-llvm-disasm.txt \
            --output edgeai-static-evidence/loader-jni-indirect-patterns.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('edgeai-static-evidence/loader-jni-indirect-patterns.json').read_text())
          assert d['function']=='JNI_OnLoad'
          assert d['architecture']=='AArch64'
          assert d['indirect_site_count']==8
          assert d['pattern_counts'].get('pc_relative_indexed_table_dispatch_candidate')==7
          assert d['pattern_counts'].get('unresolved_indirect_call')==1
          assert not d['targets_resolved'] and not d['jump_table_contents_read']
          assert not d['code_executed']
          print('EDGEAI_ARM64_LOADER_7_UNRESOLVED_TABLE_DISPATCH_SITES_PASS')
          PY
      - name: Verify local unsigned jump-table guards against actual Oxide loader instructions
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/edgeai_arm64_dispatch_bounds.py \
            edgeai-static-evidence/loader-jni-indirect-patterns.json \
            edgeai-static-evidence/loader-jni-llvm-disasm.txt \
            --output edgeai-static-evidence/loader-jni-local-guard-evidence.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("edgeai-static-evidence/loader-jni-local-guard-evidence.json")
          d=json.loads(p.read_text())
          confirmed=[x for x in d["sites"] if x["local_guard"]=="unsigned_index_upper_bound_candidate"]
          assert d["architecture"]=="AArch64" and d["function"]=="JNI_OnLoad",d
          assert d["dispatch_site_count"]==8 and len(confirmed)==2,d
          assert {x["pc"] for x in confirmed}=={"0x4ea134","0x4ea1f8"},d
          assert all(x["local_unsigned_index_max_inclusive"]==7 for x in confirmed),d
          assert not d["path_feasibility_proven"],d
          assert not d["jump_table_bytes_read"] and not d["indirect_targets_resolved"],d
          assert not d["original_game_executed"],d
          print("EDGEAI_ARM64_TWO_LOCAL_GUARDS_ORIGINAL_OXIDE_PASS")
          PY
      - name: Classify real IL2CPP named ELF functions without assuming gameplay semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/edgeai_arm64_symbol_triage.py split_config.arm64_v8a.apk \
            --library libil2cpp.so --output edgeai-static-evidence/oxide-il2cpp-name-triage.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("edgeai-static-evidence/oxide-il2cpp-name-triage.json").read_text())
          assert d["status"]=="ARM64_ELF_SYMBOL_NAME_TRIAGE_PASS",d
          assert d["named_function_symbols"]==1747,d
          assert d["library_bytes"]==236123768,d
          assert d["sha256"]=="3343335d9575871138f6cda866c748edd97c68dd46db74df850d0318f4c145b4",d
          assert d["gameplay_functions_confirmed"]==0 and d["runtime_offsets_confirmed"]==0
          assert not d["code_executed"]
          print("EDGEAI_ORIGINAL_OXIDE_1747_SYMBOL_NAME_TRIAGE_PASS")
          PY
      - name: Inventory original Unity engine exports using EdgeAI AArch64 CFG
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/edgeai_arm64_unity_exports.py split_config.arm64_v8a.apk \
            --output edgeai-static-evidence/oxide-unity-engine-export-cfg.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("edgeai-static-evidence/oxide-unity-engine-export-cfg.json").read_text())
          assert d["status"]=="AARCH64_UNITY_ENGINE_STATIC_EXPORTS_PASS",d
          assert d["library"]=="libunity.so" and d["function_count"]==4,d
          sizes={"UnitySendMessage":92,"UnityInitialize":504,"UnityShutdown":48,"JNI_OnLoad":196}
          assert {x["name"]:x["size_bytes"] for x in d["functions"]}==sizes,d
          assert all(x["candidate_blocks"]>=1 for x in d["functions"]),d
          assert not d["executed_original_game"] and not d["unity_camera_located"] and not d["player_positions_located"],d
          print("EDGEAI_ORIGINAL_UNITY_ENGINE_EXPORTS_STATIC_PASS")
          PY
      - name: Cross-check four original Unity public APIs against LLVM instruction by instruction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, subprocess, sys, tempfile, zipfile
          from pathlib import Path
          sys.path.insert(0, "tools")
          from edgeai_arm64_branch_map import analyze_split
          from edgeai_arm64_llvm_crosscheck import compare
          apk=Path("split_config.arm64_v8a.apk")
          output=Path("edgeai-static-evidence")
          names=("UnitySendMessage","UnityInitialize","UnityShutdown","JNI_OnLoad")
          with tempfile.TemporaryDirectory(prefix="edgeai-llvm-unity-") as tmp:
              binary=Path(tmp)/"libunity.so"
              with zipfile.ZipFile(apk) as archive, archive.open("lib/arm64-v8a/libunity.so") as src, binary.open("wb") as dst:
                  while True:
                      b=src.read(1024*1024)
                      if not b: break
                      dst.write(b)
              summaries=[]
              for name in names:
                  scan=analyze_split(apk,name="libunity.so",function=name,max_results=1000)
                  start=int(scan["entry"],16)
                  end=start+scan["size_bytes"]
                  proc=subprocess.run([
                      "llvm-objdump","-d","--no-show-raw-insn",
                      "--start-address="+hex(start),"--stop-address="+hex(end),str(binary)],
                      check=True,capture_output=True,text=True)
                  (output/("llvm-unity-"+name+".txt")).write_text(proc.stdout)
                  report=compare(scan,proc.stdout)
                  (output/("llvm-unity-"+name+"-comparison.json")).write_text(json.dumps(report,indent=2)+"\n")
                  assert report["status"]=="MATCH",report
                  assert report["scanner_controls"]==report["llvm_controls"]==report["exact_agreements"],report
                  assert report["direct_target_comparisons"]==report["direct_target_agreements"],report
                  summaries.append({"name":name,"matched":report["exact_agreements"],"size":scan["size_bytes"]})
              (output/"llvm-unity-four-export-summary.json").write_text(json.dumps(summaries,indent=2)+"\n")
              print("EDGEAI_ORIGINAL_UNITY_FOUR_EXPORT_LLVM_EXACT_PASS",json.dumps(summaries))
          PY
      - name: Cross-check all 117 original loader control targets against LLVM
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/edgeai_arm64_llvm_crosscheck.py \
            edgeai-static-evidence/loader-jni-arm64-control-transfers.json \
            edgeai-static-evidence/loader-jni-llvm-disasm.txt \
            --output edgeai-static-evidence/loader-jni-exact-target-comparison.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("edgeai-static-evidence/loader-jni-exact-target-comparison.json").read_text())
          assert d["function"]=="JNI_OnLoad",d
          assert d["scanner_controls"]==d["llvm_controls"]==d["exact_agreements"]==117,d
          assert d["direct_target_comparisons"]==d["direct_target_agreements"],d
          assert d["direct_target_comparisons"]>20,d
          assert not d["original_code_executed"],d
          print("EDGEAI_ORIGINAL_LOADER_117_BRANCH_OPCODE_AND_TARGETS_MATCH")
          PY
      - name: Read guarded ARM64 relative jump-table bytes from original ELF, only with checked bounds
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/edgeai_arm64_table_entries.py \
            split_config.arm64_v8a.apk \
            edgeai-static-evidence/loader-jni-indirect-patterns.json \
            edgeai-static-evidence/loader-jni-local-guard-evidence.json \
            edgeai-static-evidence/loader-jni-llvm-disasm.txt \
            --function-size 4524 \
            --output edgeai-static-evidence/loader-jni-bounded-table-targets.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("edgeai-static-evidence/loader-jni-bounded-table-targets.json").read_text())
          assert x["function"]=="JNI_OnLoad" and x["site_count"]==8,x
          assert x["table_sites_with_static_candidates"]>=1,x
          assert all(1<=len(s["candidate_entries"])<=64 for s in x["sites"] if s["status"]=="STATIC_CANDIDATES"),x
          assert not x["game_executed"] and not x["all_runtime_targets_confirmed"],x
          print("EDGEAI_ORIGINAL_LOADER_BOUNDED_TABLE_BYTES_CHECK_PASS")
          PY
      - name: Upload audit logs, no game executables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oxide-edgeai-elf64-static-audit
          path: edgeai-static-evidence/*
          if-no-files-found: warn
          retention-days: 14
