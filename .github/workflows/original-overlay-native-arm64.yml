name: Oxide original loading-screen overlay interop on native ARM64

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/original-overlay-native-arm64.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-isolated-probe:
    name: Build standalone ARM64 overlay diagnostic APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: esp_core
      - name: Install Android NDK and build SDK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$ANDROID_HOME"
          SDKMGR="$ROOT/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(find "$ROOT/cmdline-tools" -type f -name sdkmanager | head -n1)"
          fi
          yes | "$SDKMGR" --sdk_root="$ROOT" --licenses >/dev/null || true
          "$SDKMGR" --sdk_root="$ROOT" --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
      - name: Build isolated signed JNI diagnostic app, not game APK
        run: bash esp_core/android_probe/build_smoke_apk.sh android-probe-out
      - name: Transfer isolated diagnostic APK to ARM64 runner
        uses: actions/upload-artifact@v4
        with:
          name: oxide-isolated-arm64-overlay-probe
          path: android-probe-out/oxide-bridge-jni-smoke.apk
          if-no-files-found: error
          retention-days: 3

  original-and-overlay:
    name: Unmodified Oxide and overlay sharing same native ARM64 screen
    needs: build-isolated-probe
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - name: Checkout only original signed splits and diagnostic scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            base.apk
            split_config.arm64_v8a.apk
            split_config.xxhdpi.apk
            tools
            esp_core
      - uses: actions/download-artifact@v4
        with:
          name: oxide-isolated-arm64-overlay-probe
          path: overlay-probe
      - name: Set up native ARM64 Android binder and screenshot inspection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p oxide-overlay-evidence
          uname -a | tee oxide-overlay-evidence/host.txt
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" adb python3-pil
          sudo modprobe binder_linux devices=binder,hwbinder,vndbinder
          sudo mkdir -p /dev/binderfs
          sudo mount -t binder binder /dev/binderfs
          test -e /dev/binderfs/binder
          python3 -c 'from PIL import Image; print("PIL available")'
      - name: Boot Android 13 ARM64 without game patches
        shell: bash
        run: |
          set -euo pipefail
          timeout 420 docker pull redroid/redroid:13.0.0_64only-latest
          sudo chmod a+rw /dev/binderfs/binder || true
          mkdir -p /tmp/oxide-native-overlay-data
          docker run -d --rm --privileged --name oxide-native-overlay \
            -p 127.0.0.1:5555:5555 -v /dev/binderfs:/dev/binderfs \
            -v /tmp/oxide-native-overlay-data:/data \
            redroid/redroid:13.0.0_64only-latest androidboot.redroid_gpu_mode=guest \
            | tee oxide-overlay-evidence/container_id.txt
          for i in $(seq 1 50); do
            adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true
            if timeout 5 adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | grep -q '^1'; then
              echo ANDROID_BOOT_COMPLETED | tee oxide-overlay-evidence/boot.txt
              break
            fi
            sleep 4
          done
          test -s oxide-overlay-evidence/boot.txt
          adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abilist | tee oxide-overlay-evidence/abis.txt
          grep -q arm64-v8a oxide-overlay-evidence/abis.txt
      - name: Fetch the exact original 867 MB split without changing it
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 \
            --max-time 1200 --silent --show-error \
            --output split_UnityDataAssetPack.apk \
            "https://github.com/48348484488/oxide/releases/download/v1.0.0/split_UnityDataAssetPack.apk"
          python3 tools/verify_original_splits.py . \
            --output oxide-overlay-evidence/original_hashes.json
      - name: Start diagnostic overlay, launch original, capture real screen and logs
        shell: bash
        run: |
          bash esp_core/android_probe/original_overlay_smoke.sh \
            127.0.0.1:5555 . overlay-probe/oxide-bridge-jni-smoke.apk \
            oxide-overlay-evidence
      - name: Validate dimmed/bright diagnostic overlay with real Activity foreground evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s esp_core/android_probe/tests \
            -p 'test_original_overlay_pixels.py' -v
          python3 esp_core/android_probe/check_original_overlay_pixels.py \
            oxide-overlay-evidence | tee oxide-overlay-evidence/loading_overlay_validation.txt
      - name: Preserve non-proprietary evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oxide-original-overlay-native-arm64-proof
          path: |
            oxide-overlay-evidence/*.txt
            oxide-overlay-evidence/*.json
            oxide-overlay-evidence/*.png
            oxide-overlay-evidence/*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Label this limited integration proof
        if: always()
        shell: bash
        run: |
          {
            echo "### Native ARM64 original loading-screen overlay experiment"
            echo "Game original: unchanged signed 4-split Oxide 1.14.11949."
            echo "Overlay: standalone diagnostic package using supplied synthetic points."
            echo "Results must distinguish pixel proof from original-game process termination."
            echo "Even success is NOT a playable game ESP, player-coordinate extraction, or a security bypass."
            if [ -f oxide-overlay-evidence/loading_overlay_validation.txt ]; then
              echo '#### Native pixel and Activity validation'
              cat oxide-overlay-evidence/loading_overlay_validation.txt
            fi
            if [ -f oxide-overlay-evidence/original_foreground.txt ]; then
              cat oxide-overlay-evidence/original_foreground.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"
