name: EdgeAI extract verified original crafting recipe item sprites
on:
  workflow_dispatch:
  push:
    paths:
      - tools/export_original_craft_icons.py
      - .github/workflows/edgeai_export_original_craft_icons.yml
permissions:
  contents: read
  actions: read
jobs:
  original-craft-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            xapk_original
            tools/export_original_craft_icons.py
          filter: blob:none
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download independently verified real Unity crafting table
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/lios-craft-config
          SOURCE_RUN=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow edgeai_decode_original_craft.yml --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$SOURCE_RUN"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name EdgeAI-Original-Unity-Craft-Config --dir /tmp/lios-craft-config
          test -s /tmp/lios-craft-config/verified_craft_config.json
      - name: Extract only exact verified item sprites from source bundles
        run: |
          python -m pip install -q UnityPy Pillow
          python -u tools/export_original_craft_icons.py \
            --parts xapk_original \
            --config /tmp/lios-craft-config/verified_craft_config.json \
            --out original_craft_icons/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Original-Unity-Craft-Recipe-Icons
          path: original_craft_icons/
          retention-days: 30
          if-no-files-found: warn
