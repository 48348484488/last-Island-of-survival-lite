name: Oxide original APK on native ARM64 Android container

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/redroid-original-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-arm64-game:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - name: Fetch unmodified original APK splits from repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            base.apk
            split_config.arm64_v8a.apk
            split_config.xxhdpi.apk
      - name: Configure ARM64 kernel Binder and Android debugging tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p oxide-original-arm64
          echo "$(uname -a)" | tee oxide-original-arm64/host.txt
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" adb
          sudo modprobe binder_linux devices=binder,hwbinder,vndbinder
          sudo mkdir -p /dev/binderfs
          sudo mount -t binder binder /dev/binderfs
          ls -l /dev/binderfs | tee oxide-original-arm64/binderfs.txt
      - name: Start unmodified Android 13 ARM64 guest
        shell: bash
        run: |
          set -euo pipefail
          timeout 420 docker pull redroid/redroid:13.0.0_64only-latest
          sudo chmod a+rw /dev/binderfs/binder || true
          mkdir -p /tmp/oxide-redroid-data
          docker run -d --rm --privileged --name oxide-native-android \
            -p 127.0.0.1:5555:5555 -v /dev/binderfs:/dev/binderfs \
            -v /tmp/oxide-redroid-data:/data \
            redroid/redroid:13.0.0_64only-latest androidboot.redroid_gpu_mode=guest \
            | tee oxide-original-arm64/container_id.txt
          for i in $(seq 1 45); do
            adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true
            if timeout 5 adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | grep -q '^1'; then
              echo "ANDROID_BOOT_COMPLETED" | tee oxide-original-arm64/boot.txt
              break
            fi
            sleep 4
          done
          test -s oxide-original-arm64/boot.txt
          adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abilist | tee oxide-original-arm64/abis.txt
          grep -q arm64-v8a oxide-original-arm64/abis.txt
          adb -s 127.0.0.1:5555 shell getprop ro.build.version.release | tee oxide-original-arm64/android_version.txt
      - name: Retrieve original Unity asset APK and validate its checksum
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 \
            --max-time 1200 --silent --show-error \
            --output split_UnityDataAssetPack.apk \
            "https://github.com/48348484488/oxide/releases/download/v1.0.0/split_UnityDataAssetPack.apk"
          echo "2f0f7f1be7d78d269f710edd471c40a9755a93a07481cae0c058356515e19834  split_UnityDataAssetPack.apk" | sha256sum --check
      - name: Install all four original APK splits, no modifications
        shell: bash
        run: |
          set -euo pipefail
          adb -s 127.0.0.1:5555 install-multiple -r \
            base.apk split_config.arm64_v8a.apk split_config.xxhdpi.apk split_UnityDataAssetPack.apk \
            > oxide-original-arm64/install.log 2>&1
          cat oxide-original-arm64/install.log
          grep -q '^Success' oxide-original-arm64/install.log
          adb -s 127.0.0.1:5555 shell pm path com.catsbit.oxidesurvivalisland \
            | tee oxide-original-arm64/installed_packages.txt
      - name: Observe real original process, startup and native crash logs
        shell: bash
        run: |
          set -u
          SERIAL="127.0.0.1:5555"
          PKG="com.catsbit.oxidesurvivalisland"
          adb -s "$SERIAL" logcat -c 2>/dev/null || true
          # Persist a live stream before launch; Android's ring buffers can
          # overwrite evidence if read only after the app has terminated.
          adb -s "$SERIAL" logcat -b all -v threadtime \
            > oxide-original-arm64/live_logcat.txt 2>&1 &
          LOGCAT_PID=$!
          adb -s "$SERIAL" shell cat /proc/meminfo \
            > oxide-original-arm64/meminfo_before.txt 2>&1 || true
          adb -s "$SERIAL" shell am force-stop "$PKG" || true
          adb -s "$SERIAL" shell cmd package resolve-activity --brief -c android.intent.category.LAUNCHER "$PKG" \
            > oxide-original-arm64/resolved_launcher.txt 2>&1 || true
          # Monkey exits with -5 on redroid before starting the game.
          # Use the original package's explicit launcher Activity instead.
          adb -s "$SERIAL" shell am start -W \
            -n "$PKG/cTOOT3.abKmV1.tP0Gr1.OxideActivity" \
            > oxide-original-arm64/launch.txt 2>&1 || true
          cat oxide-original-arm64/resolved_launcher.txt oxide-original-arm64/launch.txt
          # Observe the first five seconds at high temporal resolution; the
          # original may start and exit before the old 10-second checkpoint.
          {
            echo "second UTC_TIME pidof uid resident_kb vm_size_kb state"
            for sec in $(seq 1 7); do
              PID="$(adb -s "$SERIAL" shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)"
              echo "$sec $(date -u +%H:%M:%S) ${PID:-none}" 
              if [ -n "$PID" ]; then
                adb -s "$SERIAL" shell cat "/proc/$PID/status" 2>/dev/null \
                  | grep -E '^(Name|State|VmRSS|VmSize|Threads):' || true
                echo "oom_score_adj / oom_score:"
                adb -s "$SERIAL" shell "cat /proc/$PID/oom_score_adj /proc/$PID/oom_score" 2>/dev/null || true
              fi
              if [ "$sec" = 2 ]; then
                adb -s "$SERIAL" exec-out screencap -p \
                  > oxide-original-arm64/screen_2s.png 2>/dev/null || true
              fi
              sleep 1
            done
          } > oxide-original-arm64/early_process.txt
          sleep 3
          adb -s "$SERIAL" shell pidof "$PKG" | tr -d '\r' | tee oxide-original-arm64/pid_10s.txt || true
          adb -s "$SERIAL" exec-out screencap -p > oxide-original-arm64/screen_10s.png 2>/dev/null || true
          sleep 25
          adb -s "$SERIAL" shell pidof "$PKG" | tr -d '\r' | tee oxide-original-arm64/pid_35s.txt || true
          adb -s "$SERIAL" exec-out screencap -p > oxide-original-arm64/screen_35s.png 2>/dev/null || true
          adb -s "$SERIAL" logcat -d -v threadtime > oxide-original-arm64/logcat.txt 2>&1 || true
          adb -s "$SERIAL" logcat -b all -d -v threadtime > oxide-original-arm64/all_buffers.txt 2>&1 || true
          kill "$LOGCAT_PID" 2>/dev/null || true
          wait "$LOGCAT_PID" 2>/dev/null || true
          adb -s "$SERIAL" shell cat /proc/meminfo > oxide-original-arm64/meminfo_after.txt 2>&1 || true
          adb -s "$SERIAL" shell dumpsys meminfo "$PKG" > oxide-original-arm64/app_meminfo.txt 2>&1 || true
          sudo dmesg --ctime | tail -n 500 > oxide-original-arm64/host_kernel_tail.txt 2>&1 || true
          docker stats --no-stream oxide-native-android > oxide-original-arm64/container_resources.txt 2>&1 || true
          grep -iE 'lowmemorykiller|lmkd|am_kill|am_proc_died|out of memory|oom_kill|killing .*process|sending signal|SIGKILL' \
            oxide-original-arm64/all_buffers.txt > oxide-original-arm64/kill_evidence.txt || true
          grep -iE 'out of memory|oom.kill|killed process|memory cgroup' \
            oxide-original-arm64/host_kernel_tail.txt > oxide-original-arm64/host_oom_evidence.txt || true
          adb -s "$SERIAL" shell dumpsys activity activities > oxide-original-arm64/activities.txt 2>&1 || true
          adb -s "$SERIAL" shell dumpsys activity exit-info "$PKG" > oxide-original-arm64/exit_info.txt 2>&1 || true
          adb -s "$SERIAL" logcat -b crash -d -v threadtime > oxide-original-arm64/crash_buffer.txt 2>&1 || true
          adb -s "$SERIAL" logcat -b events -d -v threadtime > oxide-original-arm64/events.txt 2>&1 || true
          docker logs oxide-native-android > oxide-original-arm64/container.log 2>&1 || true
          grep -iE 'FATAL EXCEPTION|Fatal signal|SIGILL|SIGSEGV|libloader\.so|libil2cpp\.so' \
            oxide-original-arm64/logcat.txt | tail -80 > oxide-original-arm64/relevant_errors.txt || true
          if [ -s oxide-original-arm64/pid_10s.txt ] && [ -s oxide-original-arm64/pid_35s.txt ]; then
            RESULT="PROCESS_RUNNING_AT_10S_AND_35S"
          elif [ -s oxide-original-arm64/pid_10s.txt ]; then
            RESULT="EXITED_BETWEEN_10S_AND_35S"
          elif grep -qE '[0-9]{4,}' oxide-original-arm64/early_process.txt; then
            RESULT="STARTED_BUT_EXITED_BEFORE_10S"
          else
            RESULT="NOT_RUNNING_AT_10S"
          fi
          echo "$RESULT" | tee oxide-original-arm64/status.txt
          {
            echo "Oxide original ARM64 process/exit diagnostic (non-invasive)"
            echo "RESULT=$RESULT"
            if grep -qiE 'Process *: Sending signal[.] PID: [0-9]+ SIG: 9' oxide-original-arm64/all_buffers.txt; then
              echo "ANDROID_PROCESS_SENDSIGNAL_9=OBSERVED"
            else
              echo "ANDROID_PROCESS_SENDSIGNAL_9=NOT_OBSERVED"
            fi
            # logcat threadtime prefix is: date time EMITTER_PID THREAD_ID level tag : text
            # If emitter PID equals signal target PID, app process logged its own SIGKILL.
            if awk '$6=="Process" && $7==":" && $8=="Sending" && $9=="signal." && $10=="PID:" && $12=="SIG:" && $13=="9" && $3==$11 {seen=1; exit} END {exit !seen}' oxide-original-arm64/all_buffers.txt; then
              echo "SELF_SIGKILL_LOG=OBSERVED"
            else
              echo "SELF_SIGKILL_LOG=NOT_OBSERVED"
            fi
            if [ -s oxide-original-arm64/host_oom_evidence.txt ]; then
              echo "HOST_OOM_LOG=HAS_MATCHES_REVIEW_CONTEXT"
            else
              echo "HOST_OOM_LOG=NO_MATCHES_IN_TAIL_NOT_PROOF_OF_ABSENCE"
            fi
            echo "ROOT_CAUSE=UNDETERMINED"
            echo "A security-warning screenshot, SIGKILL, or host OOM keyword alone does not prove the signal sender."
            echo "Review all_buffers.txt, live_logcat.txt, exit_info.txt, kill_evidence.txt, and host_kernel_tail.txt."
          } > oxide-original-arm64/exit_diagnosis.txt
          if [ "$RESULT" != "PROCESS_RUNNING_AT_10S_AND_35S" ]; then
            echo "Original app did not pass basic boot; inspect unmodified native crash logs."
            exit 1
          fi
      - name: Save proof and exact limitations
        if: always()
        shell: bash
        run: |
          {
            echo "## Original unmodified Oxide 1.14.11949 on native ARM64 Android"
            echo "Status: $(cat oxide-original-arm64/status.txt 2>/dev/null || echo INCOMPLETE)"
            echo "ABI: $(cat oxide-original-arm64/abis.txt 2>/dev/null || echo UNKNOWN)"
            echo "Android: $(cat oxide-original-arm64/android_version.txt 2>/dev/null || echo UNKNOWN)"
            if [ -f oxide-original-arm64/exit_diagnosis.txt ]; then
              echo '#### Additional termination evidence'
              echo '```text'
              cat oxide-original-arm64/exit_diagnosis.txt
              echo '```'
            fi
            echo "This is a process start test only, not proof of a playable menu, multiplayer player coordinates, or ESP."
            echo "No APK was modified and no process injection was performed."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve logs without redistributing APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oxide-original-native-arm64-smoke
          path: oxide-original-arm64/
          retention-days: 14
          if-no-files-found: warn
