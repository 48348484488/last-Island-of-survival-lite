name: Extract original Unity building part item icon atlas
on:
  workflow_dispatch:
  push:
    paths:
      - tools/audit_original_build_part_icons.py
      - .github/workflows/audit_original_build_part_icons.yml
permissions:
  contents: read
jobs:
  export-part-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            xapk_original
            tools/audit_original_build_part_icons.py
          sparse-checkout-cone-mode: false
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -q UnityPy
          python -u tools/audit_original_build_part_icons.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Original-LITE-Player-Building-Part-Icons
          path: original_part_icons/
          retention-days: 30
          if-no-files-found: warn
