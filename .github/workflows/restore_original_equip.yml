name: Recover source original weapon draw and holster clips
on:
  push:
    paths:
      - tools/restore_original_equip.py
      - .github/workflows/restore_original_equip.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract-equip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy trimesh Pillow "UnityPy>=1.20,<2"
      - run: python tools/restore_original_equip.py
      - name: Commit verified source clips to recreated game and preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_island_recreated_game/authentic_animations.npz last_island_recreated_game/importar_sacar_trocar_arma_original/
          if ! git diff --staged --quiet; then
            git commit -m "Restore original Unity draw and holster source clips"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-axe-draw-holster-3d
          path: last_island_recreated_game/importar_sacar_trocar_arma_original/
          if-no-files-found: warn
