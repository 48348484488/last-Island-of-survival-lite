name: Extract original LITE inventory and crafting Unity sprites
on:
  workflow_dispatch:
  push:
    paths:
      - tools/export_original_craft_ui.py
      - .github/workflows/export_original_craft_ui.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            xapk_original
            tools/export_original_craft_ui.py
          filter: blob:none
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Decode source UIImage Sprites from XAPK
        run: |
          python -m pip install -q UnityPy Pillow
          python -u tools/export_original_craft_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Original-Unity-Craft-UI-Sprites
          path: exported_original_craft_ui/
          retention-days: 30
          if-no-files-found: warn
