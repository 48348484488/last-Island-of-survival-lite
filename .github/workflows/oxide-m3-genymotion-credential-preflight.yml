name: Oxide M3 Genymotion account connection check
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oxide-m3-genymotion-credential-preflight.yml'

permissions:
  contents: read

jobs:
  secret-exists-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TOKEN_CONFIGURED: ${{ secrets.GENYMOTION_API_TOKEN != '' }}
    steps:
      - name: Check authorized account connection without reading or contacting it
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          present = os.environ.get("TOKEN_CONFIGURED", "false").lower() == "true"
          report = {
              "status": "TOKEN_PRESENT_CLOUD_NOT_TESTED" if present else "BLOCKED_NO_GENYMOTION_API_TOKEN",
              "genymotion_token_secret_configured": present,
              "genymotion_account_login_tested": False,
              "trial_approved": "NOT_VERIFIED",
              "cloud_instance_started": False,
              "cloud_api_contacted": False,
              "apk_downloaded": False,
              "gameplay_confirmed": False,
              "next_action": ("Confirm active approved trial and cloud instance UUID; then use manual trial"
                              if present else
                              "Owner must validate Genymotion account, obtain approved trial and save an API token in GitHub Actions secrets."),
          }
          Path("reports").mkdir(exist_ok=True)
          Path("reports/genymotion-credential-readiness.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("Status:", report["status"])
          print("Cloud access, account identity, payments, APKs and gameplay were NOT tested.")
          PY
      - name: Keep credential readiness evidence without storing credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oxide-m3-genymotion-credential-readiness
          path: reports/
          retention-days: 7
          if-no-files-found: warn
