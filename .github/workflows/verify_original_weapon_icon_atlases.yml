name: Verify exact original Last Island weapon icon atlas sprites
on:
  push:
    paths:
      - tools/verify_original_weapon_icon_atlases.py
      - .github/workflows/verify_original_weapon_icon_atlases.yml
  workflow_dispatch:
permissions: {contents: write}
jobs:
  icon-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            xapk_original
            tools
            last_island_recreated_game/assets
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'UnityPy>=1.20,<2' Pillow
      - name: Prove image bytes from original Sprite PathIDs
        run: python -u tools/verify_original_weapon_icon_atlases.py
      - name: Publish ONLY source-proven weapon icons and binary provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_island_recreated_game/assets/hud_original_xapk/complete_source_mapping/verified_equipped_weapon_icons.json
          git add last_island_recreated_game/assets/hud_original_xapk/complete_source_mapping/weapon_verified/gun_m4_*.png
          git add last_island_recreated_game/assets/hud_original_xapk/complete_source_mapping/original_weapon_icon_atlas_provenance.json
          if ! git diff --cached --quiet; then
            git commit -m "Recover authentic M4 icon from gun.ab using original ItemCfg linkage"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: last-island-original-weapon-icon-atlas-evidence
          path: |
            last_island_recreated_game/assets/hud_original_xapk/complete_source_mapping/original_weapon_icon_atlas_provenance.json
            last_island_recreated_game/assets/hud_original_xapk/complete_source_mapping/verified_equipped_weapon_icons.json
            last_island_recreated_game/assets/hud_original_xapk/complete_source_mapping/weapon_verified/
          if-no-files-found: warn
