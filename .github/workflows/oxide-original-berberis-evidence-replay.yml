name: Oxide original Berberis artifact replay - read only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oxide-original-berberis-evidence-replay.yml'
      - 'tools/oxide_berberis_artifact_replay.py'
      - 'tests/test_oxide_berberis_artifact_replay.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: oxide-original-berberis-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replay-original-existing-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Offline unit tests and syntax
        run: |
          set -euo pipefail
          python3 -m compileall -q tools/oxide_berberis_artifact_replay.py tools/oxide_berberis_logcat_audit.py tools/oxide_exit_timeline.py
          python3 -m unittest discover -s tests -p 'test_oxide_berberis_artifact_replay.py' -v
          python3 -m unittest discover -s tests -p 'test_oxide_berberis_logcat_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_oxide_exit_timeline.py' -v

      - name: Preflight small existing original evidence artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/48348484488/oxide/actions/artifacts/12011154062 > "$RUNNER_TEMP/original-artifact-metadata.json"
          python3 - "$RUNNER_TEMP/original-artifact-metadata.json" <<'PY'
          import json, sys
          from pathlib import Path
          a=json.loads(Path(sys.argv[1]).read_text())
          assert a["id"] == 12011154062
          assert a["name"] == "oxide-x86-nativebridge-original-kvm-recovery-once"
          assert a["expired"] is False
          assert 0 < a["size_in_bytes"] < 10_000_000, "Only small log evidence is authorized"
          assert a["workflow_run"]["id"] == 38818956665
          print("Verified existing read-only evidence artifact: bytes", a["size_in_bytes"])
          PY

      - name: Download ONLY the previous diagnostic artifact, never any APK or Android image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence reports
          gh run download 38818956665 --repo 48348484488/oxide \
            --name oxide-x86-nativebridge-original-kvm-recovery-once --dir evidence
          mapfile -d '' records < <(find evidence -type f -name 'logcat.txt' -print0)
          test "${#records[@]}" -eq 1
          python3 tools/oxide_berberis_artifact_replay.py \
            --logcat "${records[0]}" --output reports/original-berberis-evidence.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("reports/original-berberis-evidence.json").read_text())
          assert r["all_checks_passed"] is True
          assert r["original_gameplay_verified"] is False
          assert r["native_arm64_compatibility"] == "NOT_ESTABLISHED"
          with Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).open("a") as f:
              f.write("### Original Oxide Berberis logcat replay\n")
              f.write(f"- Verdict: {r['status']}\n")
              f.write(f"- Original PID: {r['original_pid']}\n")
              f.write(f"- Undefined opcode: {r['reported_opcode']}\n")
              f.write(f"- Interval: {r['observed_signal_delta_ms']} ms\n")
              f.write(f"- SHA256 of logcat: {r['source_logcat_sha256']}\n")
              f.write("- 35s/gameplay: NOT VERIFIED; no APK or Android download\n")
          PY

      - name: Upload tiny read-only JSON provenance only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oxide-original-berberis-existing-logcat-audit
          path: reports/original-berberis-evidence.json
          if-no-files-found: warn
          retention-days: 14

      - name: Update M4 with the actual offline replay result
        if: always()
        uses: actions/github-script@v7
        env:
          AUDIT_STATUS: ${{ job.status }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const marker = '<!-- oxide-original-berberis-replay:' + context.runId + ' -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: 4, per_page: 100
            });
            if (comments.some(c => c.body?.includes(marker))) return;
            const body = marker + '\n' +
              '**Replay de artefato original, sem APK/Android:** ' + process.env.AUDIT_STATUS + '\n' +
              'Run: https://github.com/' + owner + '/' + repo + '/actions/runs/' + context.runId + '\n' +
              'Artifact original: #12011154062 da execução #38818956665. ' +
              'Relatório JSON pequeno anexado somente quando o gate do logcat aceita a evidência. ' +
              'Sem 35 segundos, menu ou gameplay comprovados.';
            await github.rest.issues.createComment({owner, repo, issue_number: 4, body});
